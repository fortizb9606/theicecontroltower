}

/* ── RADAR: órbita concéntrica ─────── */
/* ══════════════════════════════════════════════════════════
   DISPOSICIÓN DE LA ÓRBITA

   Los ángulos ya no están escritos a mano. La torre prueba varias
   disposiciones y se queda con la primera en la que ninguna tarjeta
   se pisa, se sale del marco ni tapa el centro. Así funciona con
   cualquier repartición de estados: si mañana hay cinco críticos y
   ningún "en curso", igual se acomoda.
   ══════════════════════════════════════════════════════════ */
function porBanda(){
  const b={crit:[],alert:[],ok:[]};
  CHIEFS().forEach(c=>b[estadoDe(c)].push(c));
  return b;
}

function puntoDe(c,grados){
  const [rx,ry]=BAND[estadoDe(c)],a=grados*Math.PI/180;
  return {x:50+Math.cos(a)*rx, y:50+Math.sin(a)*ry};
}

function sirveDisposicion(mapa,med){
  const {W,H,w,h,hw,hh}=med;
  const pts=CHIEFS().map(c=>{
    const p=mapa.puntos[c.id]||{x:50,y:50};
    return {x:(p.x-50)/100*W, y:(p.y-50)/100*H};
  });
  for(const p of pts){
    if(Math.abs(p.x)+w/2 > W/2+1) return false;
    if(Math.abs(p.y)+h/2 > H/2+1) return false;
    if(Math.abs(p.x) < (w+hw)/2 && Math.abs(p.y) < (h+hh)/2) return false;
  }
  for(let i=0;i<pts.length;i++)
    for(let j=i+1;j<pts.length;j++)
      if(Math.abs(pts[i].x-pts[j].x)<w && Math.abs(pts[i].y-pts[j].y)<h) return false;
  return true;
}

const puntosDeAngulos=a=>{
  const p={};
  CHIEFS().forEach(c=>{ p[c.id]=puntoDe(c, a[c.id]!=null?a[c.id]:-90); });
  return p;
};

function disponerOrbita(med){
  const b=porBanda(), bandas=['crit','alert','ok'];
  const intentos=[];

  /* 1. Cada Chief sobre la elipse de su estado: la distancia al centro
        marca la urgencia. Es la que mejor se lee, así que va primero. */
  intentos.push(()=>{
    const a={};
    for(const nb of bandas){
      const l=b[nb]; if(!l.length) continue;
      if(!ANG[nb]||ANG[nb].length<l.length) return null;
      l.forEach((c,i)=>a[c.id]=ANG[nb][i]);
    }
    return {modo:'bandas',puntos:puntosDeAngulos(a)};
  });

  const base={crit:-90,alert:-45,ok:0};
  for(let giro=0;giro<360;giro+=10) intentos.push(()=>{
    const a={};
    for(const nb of bandas){
      const l=b[nb]; if(!l.length) continue;
      l.forEach((c,i)=>a[c.id]=base[nb]+giro+i*(360/l.length));
    }
    return {modo:'bandas',puntos:puntosDeAngulos(a)};
  });

  for(let giro=0;giro<360;giro+=10) intentos.push(()=>{
    const orden=ringOrder(), a={};
    orden.forEach((c,i)=>a[c.id]=-90+giro+i*(360/orden.length));
    return {modo:'bandas',puntos:puntosDeAngulos(a)};
  });

  /* 2. Si ninguna elipse alcanza —pasa cuando muchos Chiefs comparten
        estado— caemos al anillo de ocho puestos, en orden de urgencia.
        Se pierde la lectura por distancia, pero el color y el grosor de
        la línea siguen marcando quién apura. Mejor eso que una grilla. */
  intentos.push(()=>{
    const orden=ringOrder(), p={};
    orden.forEach((c,i)=>{ const q=POS[i%POS.length]; p[c.id]={x:q[0],y:q[1]}; });
    return {modo:'anillo',puntos:p};
  });

  for(const f of intentos){
    const m=f();
    if(m && sirveDisposicion(m,med)) return m;
  }
  return null;
}

/* Para la primera pintada, antes de poder medir. */
function orbitaPorDefecto(){
  const b=porBanda(), a={};
  for(const nb of ['crit','alert','ok']){
    const l=b[nb]; if(!l.length) continue;
    const angs=(ANG[nb]&&ANG[nb].length>=l.length)
      ? ANG[nb] : l.map((_,i)=>-90+i*(360/l.length));
    l.forEach((c,i)=>a[c.id]=angs[i]);
  }
  return {modo:'bandas',puntos:puntosDeAngulos(a)};
}

  html+='<div class="bar">'
    +'<select id="fChief" style="width:auto"><option value="all">Todos los Chiefs</option>'

      +'<span class="n">'+list.filter(a=>a.status==='activo').length+' activos de '+list.length+'</span></div>';

        +'<div class="step">'+String(i+1).padStart(2,'0')+'</div><div class="meat">'
        +'<h4>'+esc(a.name)+'<span class="model '+a.model.toLowerCase()+'">'+esc(a.model)+'</span>'

        +'<div class="io">'+a.inputs.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')
          +a.outputs.map(t=>'<span class="tag out">→ '+esc(t)+'</span>').join('')+'</div></div>'
        +'<div class="acts">'
          +'<button class="btn ghost sm" data-edit="'+a.id+'">Editar</button>'
          +'<button class="btn ghost sm" data-toggle="'+a.id+'">'+(a.status==='activo'?'Pausar':'Activar')+'</button>'
          +'<button class="btn ghost sm" data-dup="'+a.id+'">Duplicar</button>'
          +'<button class="btn danger sm" data-del="'+a.id+'">Eliminar</button></div></div>';
    });
    html+='</div>';
  });
  return html+'</section>';
}

function orderChain(list){
  const out=[],left=list.slice();let g=0;
  while(left.length&&g++<60){
    const i=left.findIndex(a=>!a.dependsOn||out.some(o=>o.id===a.dependsOn)||!list.some(x=>x.id===a.dependsOn));
    if(i===-1){out.push(...left);break;}
    out.push(left.splice(i,1)[0]);
  }
  return out;
}

function tags(arr,kind){

  return arr.map((t,i)=>'<span class="tag'+(kind==='out'?' out':'')+'">'+esc(t)
    +'<button data-rm="'+kind+':'+i+'" aria-label="Quitar">×</button></span>').join('');

function wireDrawer(){
  const a=S.editing,g=id=>document.getElementById(id);
  const close=()=>{S.editing=null;render();};
  g('close').onclick=close;g('cancel').onclick=close;
  g('veil').onclick=e=>{if(e.target.id==='veil')close();};
  const sync=()=>{
    a.name=g('fName').value;a.chiefId=g('fChiefSel').value;a.model=g('fModelSel').value;
    a.status=g('fStatusSel').value;a.lastRun=g('fLast').value;a.trigger=g('fTrig').value;
    a.dependsOn=g('fDep').value;a.prompt=g('fPrompt').value;
    a.links={claude:g('fClaude').value,dash:g('fDash').value,clickup:g('fClickup').value};
  };
  g('fChiefSel').onchange=()=>{sync();a.dependsOn='';render();};
  const add=k=>{sync();const inp=g(k==='in'?'addIn':'addOut'),v=inp.value.trim();
    if(!v){inp.focus();return;}(k==='in'?a.inputs:a.outputs).push(v);render();
    setTimeout(()=>{const n=document.getElementById(k==='in'?'addIn':'addOut');if(n)n.focus();},0);};
  g('btnIn').onclick=()=>add('in');g('btnOut').onclick=()=>add('out');
  g('addIn').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add('in');}};
  g('addOut').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add('out');}};
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{sync();
    const p=b.dataset.rm.split(':');(p[0]==='in'?a.inputs:a.outputs).splice(+p[1],1);render();});
  g('save').onclick=async()=>{sync();
    if(!a.name.trim()){g('fName').focus();g('fName').style.borderColor='var(--crit)';return;}
    const i=Base.datos.agentes.findIndex(x=>x.id===a.id);
    if(i>=0)Base.datos.agentes[i]=a; else Base.datos.agentes.push(a);
    const orden=i>=0?i:Base.datos.agentes.length-1;
    S.editing=null; render();
    const r=await Base.guardarAgente(a,orden);
    avisar(!r.ok?'No se pudo guardar: '+r.error
          : r.local?'Guardado solo en esta sesión: no hay conexión con la base.'
          : 'Cambios guardados en Firestore.', !r.ok||r.local);};
  const d=g('delDrawer');
  if(d) d.onclick=async()=>{
    S.editing=null;
    const r=await Base.borrarAgente(a.id);
    avisar(!r.ok?'No se pudo eliminar: '+r.error
          : r.local?'Eliminado solo en esta sesión, sin base.'
          : 'Agente eliminado de Firestore.', !r.ok||r.local);};
}

/* Cada tipo de bloque, con su forma de ejemplo. */
function ejemploBloque(b){
  const titulo=b.titulo||'Sin título';
  switch(b.tipo){
    case 'lista':  return {tipo:'lista',titulo,items:['Primer punto.','Segundo punto.']};
    case 'datos':  return {tipo:'datos',titulo,items:[{label:'Etiqueta',value:'—',note:'contexto'}]};
    case 'tabla':  return {tipo:'tabla',titulo,columnas:['Columna A','Columna B'],
                           filas:[{celdas:['valor','valor']},{celdas:['valor','valor']}]};
    case 'alerta': return {tipo:'alerta',titulo,contenido:'Lo que no puede esperar.'};
    default:       return {tipo:'texto',titulo,contenido:'Acá el agente escribe libre: su evaluación, el razonamiento, lo que quiera contarte.'};
  }
}

/* El contrato: el JSON exacto que el agente escribe en su Chief. */
function contratoDe(c){
  const e=estructura(c);
  const kpis=e.kpis.length?e.kpis:[{label:'KPI 1',note:''},{label:'KPI 2',note:''}];
  const met=e.metricas.length?e.metricas:[{label:'Métrica 1'}];
  const j={
    status:'alert',
    oneLiner:'Una línea: qué pasa en el área, en tus palabras.',
    said:'La frase con la que el Chief abre la reunión.',
    updated:'hace 20m',
    kpis:kpis.map(k=>({label:k.label,value:'—',note:k.note||''})),
    summary:['Punto 1 de lo que encontró.','Punto 2.'],
    alerts:['Lo que no puede esperar.'],
    questions:['La decisión que necesita de ti.'],
    readout:'Cómo viene el día, en dos líneas.',
    metrics:met.map(m=>({label:m.label,hoy:'—',semana:'—',pct:'0%',delta:'vs ayer',up:true})),
    bloques:(e.bloques&&e.bloques.length?e.bloques:[{titulo:'Lectura del agente',tipo:'texto'}])
      .map(b=>ejemploBloque(b))
  };
  return 'await db.collection("chiefs").doc("'+c.id+'").set(\n'
    +JSON.stringify(j,null,2).split('\n').map(l=>'  '+l).join('\n')
    +',\n  { merge: true }\n);';
}

/* ── Generador de conversaciones entre dos Chiefs ─────────────────
   Arma un diálogo a partir de lo que cada Chief tiene guardado ahora
   mismo (said/oneLiner, summary, alerts, questions, kpis) — no llama
   a ningún servicio externo, así que funciona igual desplegado en
   Netlify. Queda guardado en meetingRequests para no perderlo, y deja
   espacio para que un agente de Cowork lo enriquezca después. */
function tonoDe(c){
  const e=estadoDe(c);
  return e==='crit'?'con la mecha corta':e==='alert'?'con el ojo puesto en el tema':'con la agenda despejada';
}
function puntoClaveDe(c){
  const al=listaDe(c,'alerts'), qs=listaDe(c,'questions'), sm=listaDe(c,'summary');
  if(al.length) return {tipo:'alerta',texto:al[0]};
  if(qs.length) return {tipo:'pregunta',texto:qs[0]};
  if(sm.length) return {tipo:'punto',texto:sm[0]};
  return null;
}
function kpiHabladoDe(c){
  const k=kpiN(c,0);
  return k.label?(k.label+': '+k.value):null;
}
function generarDialogo(aId,bId,tema){
  const a=chief(aId), b=chief(bId);
  const turnos=[];
  const aperturaA=a.said||a.oneLiner||'Sin novedades de mi lado.';
  turnos.push({who:a,texto:(tema?'Sobre '+tema+': ':'')+aperturaA});
  const kb=kpiHabladoDe(b);
  const aperturaB=b.said||b.oneLiner||'Sin nada urgente.';
  turnos.push({who:b,texto:(tema?'Desde mi lado, sobre lo mismo: ':'Por mi lado: ')+aperturaB+(kb?' ('+kb+')':'')});
  const seSolapan=(x,y)=>{ x=x.toLowerCase(); y=y.toLowerCase(); return x.includes(y)||y.includes(x); };
  const pa=puntoClaveDe(a);
  if(pa && !seSolapan(aperturaA,pa.texto)) turnos.push({who:a,texto:(pa.tipo==='alerta'?'Lo que no puede esperar de mi lado: ':pa.tipo==='pregunta'?'Lo que necesito que decidas: ':'Para que quede claro: ')+pa.texto});
  const pb=puntoClaveDe(b);
  if(pb && !seSolapan(aperturaB,pb.texto)) turnos.push({who:b,texto:(pb.tipo==='alerta'?'De mi lado, lo urgente: ':pb.tipo==='pregunta'?'Y yo necesito: ':'Un punto más: ')+pb.texto});
  turnos.push({who:a,texto:'Entonces '+nombreDe(a)+' y '+nombreDe(b)+' quedamos '+tonoDe(a)+' y '+tonoDe(b)+', respectivamente. Te dejamos esto para que decidas.'});

  const entrelazar=(x,y)=>{const out=[];const n=Math.max(x.length,y.length);
    for(let i=0;i<n;i++){ if(x[i]) out.push(x[i]); if(y[i]) out.push(y[i]); } return out;};
  const pool=[
    ...entrelazar(listaDe(a,'alerts').map(t=>({c:a,t})), listaDe(b,'alerts').map(t=>({c:b,t}))),
    ...entrelazar(listaDe(a,'questions').map(t=>({c:a,t})), listaDe(b,'questions').map(t=>({c:b,t})))
  ];
  const recos=pool.slice(0,4).map(p=>nombreDe(p.c)+': '+p.t);
  if(!recos.length) recos.push('Ambas áreas están estables — no hay una decisión urgente que cruzarles todavía.');
  return {turnos,recomendaciones:recos};
}
function viewReunionGenerador(){
  const sol=(Base.datos.solicitudes||[]);
  let html='<p class="lede">Elige dos Chiefs y, si quieres, un tema. Arman una conversación con lo que '
    +'tienen guardado ahora mismo y cierran con recomendaciones. Queda guardada abajo.</p>'
    +'<div class="panel" style="margin-bottom:22px"><h3>NUEVA CONVERSACIÓN</h3>'
    +'<div class="row" style="align-items:center;flex-wrap:wrap;gap:12px">'
    +'<div class="txt" style="flex:0 0 220px"><select id="reunA">'
      +CHIEFS().map(c=>'<option value="'+c.id+'"'+(S.reunA===c.id?' selected':'')+'>'+esc(c.area)+'</option>').join('')
    +'</select></div>'
    +'<div class="txt" style="flex:0 0 auto;color:var(--dim);font-weight:700">↔</div>'
    +'<div class="txt" style="flex:0 0 220px"><select id="reunB">'
      +CHIEFS().map(c=>'<option value="'+c.id+'"'+(S.reunB===c.id?' selected':'')+'>'+esc(c.area)+'</option>').join('')
    +'</select></div>'
    +'<div class="txt" style="flex:1 1 240px"><input type="text" id="reunTema" '
      +'placeholder="Tema (opcional) — ej: cerrar el mes en azul" value="'+esc(S.reunTema)+'"></div>'
    +'<div class="acts" style="max-width:220px"><button class="btn" id="reunGenerar">Generar conversación</button></div>'
    +'</div></div>';

  html+='<div class="panel"><h3>CONVERSACIONES GUARDADAS</h3>';
  if(!sol.length){
    html+='<div class="row"><div class="txt" style="color:var(--mid)">Todavía no generas ninguna.</div></div>';
  } else {
    html+=sol.slice(0,12).map(s=>{
      const a=chief(s.chiefs&&s.chiefs[0]), b=chief(s.chiefs&&s.chiefs[1]);
      const turnos=(s.resultado&&s.resultado.turnos)||[];
      const recos=(s.resultado&&s.resultado.recomendaciones)||[];
      const fecha=s.creado?new Date(s.creado).toLocaleString('es-CL',{dateStyle:'short',timeStyle:'short'}):'';
      return '<div class="row" style="display:block;padding:16px">'
        +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap">'
          +'<span class="code" style="background:'+metaDe(a).color+'">'+esc(codigoDe(a))+'</span>'
          +'<b>'+esc(nombreDe(a))+'</b><span style="color:var(--dim)">↔</span>'
          +'<span class="code" style="background:'+metaDe(b).color+'">'+esc(codigoDe(b))+'</span>'
          +'<b>'+esc(nombreDe(b))+'</b>'
          +(s.tema?'<span class="meta" style="margin-left:8px">· '+esc(s.tema)+'</span>':'')
          +'<span class="meta" style="margin-left:auto">'+esc(fecha)+(s.local?' · solo en esta sesión':'')+'</span>'
        +'</div>'
        +'<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px">'
          +turnos.map(t=>'<div style="max-width:640px'+(t.who&&t.who.id===b.id?';margin-left:auto;text-align:right':'')+'">'
            +'<div class="meta" style="margin-bottom:2px">'+esc(t.who?nombreDe(t.who):'')+'</div>'
            +'<div style="display:inline-block;padding:9px 13px;border-radius:12px;background:rgba(79,214,255,.06);'
              +'border:1px solid rgba(96,190,255,.14);color:var(--body);font-size:13px;line-height:1.5">'+esc(t.texto)+'</div></div>').join('')
        +'</div>'
        +'<div style="border-top:1px solid var(--line);padding-top:10px">'
          +'<div class="meta" style="margin-bottom:6px">RECOMENDACIONES</div>'
          +recos.map(r=>'<div style="font-size:13px;color:var(--mid);padding:3px 0">· '+esc(r)+'</div>').join('')
        +'</div></div>';
    }).join('');
  }
  html+='</div>';
  return html;
}

/* ── Activación tarjeta ↔ zona ↔ conector ── */
let cxActive=null, cxLastTouch=0;
function cxSet(id){
  const dash=document.getElementById('cxDash'); if(!dash) return;
  const c=CHIEFS().find(x=>x.id===id); if(!c) return;
  cxActive=id;
  const brain=document.getElementById('cxBrain');
  if(brain){ brain.dataset.on=id; brain.style.setProperty('--cxa',colorCx(c)); }
  dash.querySelectorAll('.cx-card').forEach(el=>el.classList.toggle('cx-on',el.dataset.cid===id));
  dash.querySelectorAll('.cx-zone').forEach(z=>{
    const on=z.dataset.z===id;
    z.classList.toggle('cx-on',on);
    if(on) z.style.setProperty('--cxa',colorCx(c));
  });
  dash.querySelectorAll('.cx-cg').forEach(g=>g.classList.toggle('cx-on',g.dataset.cid===id));
}
function cxClear(){
  cxActive=null;
  const dash=document.getElementById('cxDash'); if(!dash) return;
  const brain=document.getElementById('cxBrain');
  if(brain) delete brain.dataset.on;
  dash.querySelectorAll('.cx-on').forEach(el=>el.classList.remove('cx-on'));
}

/* ── Conectores en codo, medidos del layout real ── */
function cxRounded(pts,r){
  if(pts.length<2) return '';
  let d=`M${pts[0].x} ${pts[0].y}`;
  for(let i=1;i<pts.length-1;i++){
    const p=pts[i],a=pts[i-1],b=pts[i+1];
    const v1={x:p.x-a.x,y:p.y-a.y},v2={x:b.x-p.x,y:b.y-p.y};
    const l1=Math.hypot(v1.x,v1.y)||1,l2=Math.hypot(v2.x,v2.y)||1;
    const rr=Math.min(r,l1/2,l2/2);
    d+=` L${p.x-v1.x/l1*rr} ${p.y-v1.y/l1*rr} Q${p.x} ${p.y} ${p.x+v2.x/l2*rr} ${p.y+v2.y/l2*rr}`;
  }
  return d+` L${pts[pts.length-1].x} ${pts[pts.length-1].y}`;
}
function cxConnectors(){
  const dash=document.getElementById('cxDash'), svg=document.getElementById('cxConn'), core=document.getElementById('cxCore');
  if(!dash||!svg||!core) return;
  svg.innerHTML='';
  if(dash.clientWidth<960||!window.matchMedia('(min-width:1281px)').matches) return;
  const dr=dash.getBoundingClientRect();
  svg.setAttribute('viewBox',`0 0 ${dr.width} ${dr.height}`);
  svg.setAttribute('preserveAspectRatio','none');
  const rel=el=>{const r=el.getBoundingClientRect();return {x:r.left-dr.left,y:r.top-dr.top,w:r.width,h:r.height,cx:r.left-dr.left+r.width/2,cy:r.top-dr.top+r.height/2};};
  const co=rel(core);
  const dd=pts=>pts.filter((p,i)=>!i||Math.hypot(p.x-pts[i-1].x,p.y-pts[i-1].y)>1.5);
  dash.querySelectorAll('.cx-card').forEach(card=>{
    const c=rel(card);
    const dx=c.cx-co.cx, dy=c.cy-co.cy;
    const horiz=Math.abs(dx)>=Math.abs(dy)*1.05;
    let A,B;
    if(horiz){
      const s=Math.sign(dx)||1;
      A={x:s>0?co.x+co.w:co.x, y:co.cy+dy*0.06};
      B={x:s>0?c.x:c.x+c.w, y:c.cy};
      var P={x:A.x+s*30,y:A.y}, Q={x:B.x-s*26,y:B.y};
      var mids=[{x:(P.x+Q.x)/2,y:P.y},{x:(P.x+Q.x)/2,y:Q.y}];
    } else {
      const s=Math.sign(dy)||1;
      A={x:co.cx+dx*0.1, y:s>0?co.y+co.h:co.y};
      B={x:c.cx, y:s>0?c.y:c.y+c.h};
      var P={x:A.x,y:A.y+s*30}, Q={x:B.x,y:B.y-s*26};
      var mids=[{x:P.x,y:(P.y+Q.y)/2},{x:Q.x,y:(P.y+Q.y)/2}];
    }
    const d=cxRounded(dd([A,P,...mids,Q,B]),16);
    const ch=CHIEFS().find(x=>x.id===card.dataset.cid);
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','cx-cg'); g.dataset.cid=card.dataset.cid;
    g.style.setProperty('--cxa',ch?colorCx(ch):'#4fd6ff');
    const mk=(tag,at)=>{const el=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const k in at)el.setAttribute(k,at[k]);g.appendChild(el);return el;};
    mk('path',{class:'cx-halo',d}); mk('path',{class:'cx-line',d}); mk('path',{class:'cx-pulse',d});
    mk('circle',{class:'cx-anchor',cx:A.x,cy:A.y,r:5}); mk('circle',{class:'cx-cdot',cx:B.x,cy:B.y,r:4.5});
    svg.appendChild(g);
    if(card.dataset.cid===cxActive) g.classList.add('cx-on');
  });
}

/* ── Polvo neural dentro de la silueta ── */
function cxDustBuild(){
  const outline=document.getElementById('cxOutline'), dust=document.getElementById('cxDust');
  if(!outline||!dust||!outline.isPointInFill) return;
  dust.innerHTML='';
  const zones=[...document.querySelectorAll('#cxZones .cx-zone')];
  const colByZone={}; CHIEFS().forEach(c=>colByZone[c.id]=colorCx(c));
  const svgEl=outline.ownerSVGElement;
  const mkPt=(x,y)=>{ if(svgEl&&svgEl.createSVGPoint){ const pt=svgEl.createSVGPoint(); pt.x=x; pt.y=y; return pt; } return new DOMPoint(x,y); };
  const pts=[]; let tries=0;
  while(pts.length<400&&tries<6500){
    tries++;
    const x=88+Math.random()*584, y=55+Math.random()*470;
    let p; try{ p=mkPt(x,y); if(!outline.isPointInFill(p)) continue; }catch(e){ return; }
    let z=null;
    for(const zn of zones){ if(zn.isPointInFill(p)){ z=zn.dataset.z; break; } }
    pts.push({x,y,z});
  }
  const frag=document.createDocumentFragment(), NS='http://www.w3.org/2000/svg';
  for(let i=0;i<pts.length;i++){
    for(let j=i+1;j<pts.length;j++){
      const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y;
      if(dx*dx+dy*dy<26*26){
        const l=document.createElementNS(NS,'line');
        l.setAttribute('x1',pts[i].x);l.setAttribute('y1',pts[i].y);
        l.setAttribute('x2',pts[j].x);l.setAttribute('y2',pts[j].y);
        l.setAttribute('stroke','rgba(126,214,255,.13)');l.setAttribute('stroke-width','.6');
        frag.appendChild(l); break;
      }
    }
  }
  pts.forEach(p=>{
    const c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);
    c.setAttribute('r',(0.9+Math.random()*1.6).toFixed(2));
    c.setAttribute('fill',p.z?(colByZone[p.z]||'#7fd4ff'):'#7fd4ff');
    c.setAttribute('opacity',(0.3+Math.random()*0.5).toFixed(2));
    if(p.z) c.dataset.z=p.z;
    frag.appendChild(c);
  });
  dust.appendChild(frag);
}

/* ── Decoración: ADN, moléculas, columnas binarias ── */
function cxDna(w,h,color){
  const A=w*0.34,cx=w/2,steps=90; let s1='',s2='';
  for(let i=0;i<=steps;i++){
    const y=h*i/steps,t=i/steps*Math.PI*3.4;
    s1+=(i?'L':'M')+(cx+A*Math.sin(t)).toFixed(1)+' '+y.toFixed(1)+' ';
    s2+=(i?'L':'M')+(cx-A*Math.sin(t)).toFixed(1)+' '+y.toFixed(1)+' ';
  }
  let r='';
  for(let i=3;i<steps;i+=6){
    const y=h*i/steps,t=i/steps*Math.PI*3.4,o=Math.abs(Math.sin(t));
    if(o<0.3) continue;
    const x1=(cx+A*Math.sin(t)).toFixed(1),x2=(cx-A*Math.sin(t)).toFixed(1),yy=y.toFixed(1);
    r+=`<line x1="${x1}" y1="${yy}" x2="${x2}" y2="${yy}" opacity="${(o*0.6).toFixed(2)}"/><circle cx="${x1}" cy="${yy}" r="2.1"/><circle cx="${x2}" cy="${yy}" r="2.1"/>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true"><g fill="none" stroke="${color}" stroke-width="1.3" opacity=".85"><path d="${s1}"/><path d="${s2}"/></g><g stroke="${color}" fill="${color}" stroke-width="1">${r}</g></svg>`;
}
function cxMol(color){
  const nodes=[[26,96],[62,68],[100,88],[130,50],[45,33],[116,128]].map(([x,y])=>[x+(Math.random()*10-5),y+(Math.random()*10-5)]);
  const bonds=[[0,1],[1,2],[2,3],[1,4],[2,5]], rad=[9,6,11,6,8,7];
  return `<svg viewBox="0 0 160 160" aria-hidden="true">
    <g stroke="${color}" stroke-width="1.35" fill="none" opacity=".7">${bonds.map(([a,b])=>`<line x1="${nodes[a][0]}" y1="${nodes[a][1]}" x2="${nodes[b][0]}" y2="${nodes[b][1]}"/>`).join('')}</g>
    <g fill="${color}">${nodes.map((n,i)=>`<circle cx="${n[0]}" cy="${n[1]}" r="${rad[i]}"/>`).join('')}${nodes.map((n,i)=>`<circle cx="${n[0]-rad[i]*0.3}" cy="${n[1]-rad[i]*0.3}" r="${(rad[i]*0.32).toFixed(1)}" fill="rgba(255,255,255,.5)"/>`).join('')}</g>
  </svg>`;
}
function cxDecorBuild(){
  const d=document.getElementById('cxDecor'); if(!d) return;
  const dna=[
    {l:'-22px',t:'110px',w:120,h:330,rot:-9,c:'#43c9ff'},
    {r:'-20px',t:'40px',w:120,h:320,rot:11,c:'#43c9ff'},
    {r:'140px',b:'-30px',w:92,h:240,rot:-14,c:'#2ee6c8',far:1}
  ];
  const mols=[
    {l:'14px',b:'64px',s:148,rot:0,c:'#43c9ff'},{r:'20px',b:'78px',s:148,rot:88,c:'#2ee6c8'},
    {l:'14px',t:'140px',s:112,rot:-16,c:'#43c9ff'},{r:'36px',t:'166px',s:126,rot:20,c:'#68bfff'},
    {r:'88px',t:'460px',s:104,rot:-8,c:'#2ee6c8',far:1},{l:'48px',t:'410px',s:96,rot:12,c:'#59cfff',far:1},
    {l:'40%',t:'-28px',s:112,rot:34,c:'#68bfff',far:1}
  ];
  let html='';
  const pos=c=>(c.r?`right:${c.r};`:`left:${c.l};`)+(c.b?`bottom:${c.b};`:`top:${c.t};`);
  dna.forEach((c,i)=>{ html+=`<div class="${c.far?'cx-far':''}" style="position:absolute;${pos(c)}width:${c.w}px;height:${c.h}px;opacity:${c.far?.45:.26};--cxrot:${c.rot}deg;transform:rotate(${c.rot}deg);animation:cxFloat ${9+i*2}s ease-in-out infinite">${cxDna(c.w,c.h,c.c)}</div>`; });
  mols.forEach((c,i)=>{ html+=`<div class="${c.far?'cx-far':''}" style="position:absolute;${pos(c)}width:${c.s}px;height:${c.s}px;opacity:${c.far?.4:.3};--cxrot:${c.rot}deg;transform:rotate(${c.rot}deg);filter:drop-shadow(0 0 16px rgba(67,213,255,.14));animation:cxFloat ${8+i*1.7}s ease-in-out ${(i*.6).toFixed(1)}s infinite">${cxMol(c.c)}</div>`; });
  const bin=n=>Array.from({length:n},()=>Math.round(Math.random())).join(' ');
  [['12px','54%'],['calc(100% - 24px)','8%'],['30%','76%']].forEach(([x,y])=>{ html+=`<div class="cx-bin" style="left:${x};top:${y}">${bin(24)}</div>`; });
  d.innerHTML=html;
}

/* ── Partículas dentro del tablero ── */
let cxParts=[];
function cxCanvasBuild(){
  const cv=document.getElementById('cxCanvas'), dash=document.getElementById('cxDash');
  if(!cv||!dash) return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const W=dash.clientWidth,H=dash.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  cv.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
  const n=Math.min(70,Math.floor(W/24));
  cxParts=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.15,vy:(Math.random()-.5)*.15,r:Math.random()*1.6+.4,a:Math.random()*.4+.08}));
}
function cxDraw(){
  const cv=document.getElementById('cxCanvas');
  if(cv&&cv.isConnected&&!document.getElementById('cxDash').classList.contains('cx-nopart')){
    const ctx=cv.getContext('2d');
    const W=parseFloat(cv.style.width)||0,H=parseFloat(cv.style.height)||0;
    ctx.clearRect(0,0,W,H);
    cxParts.forEach((p,i)=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<-10)p.x=W+10; if(p.x>W+10)p.x=-10;
      if(p.y<-10)p.y=H+10; if(p.y>H+10)p.y=-10;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(67,213,255,${p.a})`;ctx.fill();
      for(let j=i+1;j<cxParts.length;j++){
        const q=cxParts[j],d=Math.hypot(p.x-q.x,p.y-q.y);
        if(d<110){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);
          ctx.strokeStyle=`rgba(67,213,255,${((1-d/110)*.07).toFixed(3)})`;ctx.lineWidth=.6;ctx.stroke();}
      }
    });
  }
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(cxDraw);
}

/* ── Alto del tablero: mide lo que realmente queda de pantalla ── */
function cxSize(){
  /* Usa el espacio vertical disponible (para no dejar una franja muerta en pantallas
     grandes), pero con un piso alto (760px) que ya probamos sin choques de tarjetas —
     nunca se comprime por debajo de eso, así que un alto de ventana corto no rompe nada,
     solo deja de aprovechar espacio extra. */
  const dash=document.getElementById('cxDash'); if(!dash) return;
  if(!window.matchMedia('(min-width:1281px)').matches){ dash.style.height=''; return; }
  const top=dash.getBoundingClientRect().top;
  const disponible=Math.round(window.innerHeight-top-58);
  dash.style.height=Math.max(760,Math.min(disponible,980))+'px';
}

/* ── Ciclo de vida ── */
let cxBooted=false, cxScanIdx=0, cxScanClear=null;
function initCerebro(){
  const dash=document.getElementById('cxDash');
  if(!dash) return;
  cxActive=null;
  cxSize();
  cxDecorBuild();
  cxCanvasBuild();
  cxDustBuild();
  cxConnectors();
  /* re-medición cuando cargan las fuentes (las tarjetas cambian de ancho) */
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(document.getElementById('cxDash')){ cxSize(); cxConnectors(); } });

  dash.querySelectorAll('.cx-card').forEach(card=>{
    const id=card.dataset.cid;
    const touch=()=>{ cxLastTouch=Date.now(); cxSet(id); };
    card.addEventListener('mouseenter',touch);
    card.addEventListener('focusin',touch);
    card.addEventListener('mouseleave',()=>{ if(!card.matches(':focus-within')) cxClear(); });
    card.addEventListener('focusout',e=>{ if(!card.contains(e.relatedTarget)) cxClear(); });
  });
  dash.querySelectorAll('.cx-zone').forEach(z=>{
    z.addEventListener('mouseenter',()=>{ cxLastTouch=Date.now(); cxSet(z.dataset.z); });
    z.addEventListener('mouseleave',cxClear);
  });
  dash.addEventListener('mouseleave',cxClear);

  const gear=document.getElementById('cxGear'), tw=document.getElementById('cxTweaks');
  if(gear&&tw){
    gear.onclick=e=>{ e.stopPropagation(); const open=tw.classList.toggle('cx-open'); gear.setAttribute('aria-expanded',open); };
    dash.addEventListener('click',e=>{ if(!tw.contains(e.target)&&e.target!==gear){ tw.classList.remove('cx-open'); gear.setAttribute('aria-expanded','false'); } });
    tw.querySelectorAll('[data-cxtw]').forEach(sw=>sw.onclick=()=>{
      const k=sw.dataset.cxtw;
      cxTw[k]=!cxTw[k]; cxSaveTw();
      sw.setAttribute('aria-checked',cxTw[k]);
      if(k==='mol') dash.classList.toggle('cx-nomol',!cxTw.mol);
      if(k==='part') dash.classList.toggle('cx-nopart',!cxTw.part);
    });
  }

  const imo=document.getElementById('cxImOpen');
  if(imo) imo.onclick=imAbrir;
  const ago=document.getElementById('cxAgOpen');
  if(ago) ago.onclick=agAbrir;

  if(!cxBooted){
    cxBooted=true;
    let rt=null;
    window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(document.getElementById('cxDash')){ cxSize(); cxCanvasBuild(); cxConnectors(); } },160); });
    setInterval(()=>{ const el=document.getElementById('cxClock'); if(el) el.textContent=new Date().toLocaleTimeString('es-CL',{hour12:false}); },1000);
    setInterval(()=>{
      if(!cxTw.scan) return;
      if(!document.getElementById('cxDash')) return;
      if(!window.matchMedia('(min-width:1281px)').matches) return;
      if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      if(Date.now()-cxLastTouch<8000) return;
      const orden=ringOrder().map(c=>c.id);
      const id=orden[cxScanIdx%orden.length]; cxScanIdx++;
      cxSet(id);
      clearTimeout(cxScanClear);
      cxScanClear=setTimeout(()=>{ if(Date.now()-cxLastTouch>=2200) cxClear(); },2400);
    },4200);
    if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(cxDraw); else cxDraw();
  }
}


/* ══════════════════════════════════════════════════════════
   ICE MIND — resumen hablado del estado de la torre.
   Voz: Web Speech API, con selección de la mejor voz española
   disponible y frases cortas encadenadas (suena menos monótono
   que una sola oración larga). Mientras habla, va revelando los
   KPI de cada Chief mencionado, sincronizado con el guion.
   ══════════════════════════════════════════════════════════ */
let imState='idle', imPulse=0, imRafOn=false, imSegs=[], imIdx=0, imSeq=0;

function imKpiChip(c){
  const k=kpiN(c,0);
  if(!k.label) return null;
  return {code:c.code,label:k.label,value:k.value,color:colorCx(c)};
}
function imSegmentos(){
  const h=new Date().getHours();
  const sal=h<12?'Buenos días':(h<20?'Buenas tardes':'Buenas noches');
  const orden=ringOrder();
  const crit=orden.filter(c=>estadoDe(c)==='crit');
  const al=orden.filter(c=>estadoDe(c)==='alert');
  const ok=orden.filter(c=>estadoDe(c)==='ok');
  const pend=CHIEFS().reduce((n,c)=>n+listaDe(c,'questions').length,0);
  const on=Base.datos.agentes.filter(a=>a.status==='activo').length;
  const limpiar=s=>String(s||'').replace(/\s+/g,' ').trim();
  const segs=[];
  segs.push({texto:`${sal}, Felipe. Soy Ice Mind.`});
  segs.push({texto: crit.length
      ? (crit.length===1?'Hay un frente crítico.':`Hay ${crit.length} frentes críticos.`)
      : (al.length?'No hay frentes críticos, pero sí un par de cosas en atención.':'La torre está tranquila hoy.')});
  crit.forEach(c=>{
    const t=limpiar(c.said||c.oneLiner);
    if(t) segs.push({texto:`${c.area}: ${t}`, chip:imKpiChip(c)});
  });
  if(al.length){
    segs.push({texto:`En atención: ${al.map(c=>c.area).join(' y ')}.`});
    al.forEach(c=>{
      const t=limpiar(c.oneLiner);
      if(t) segs.push({texto:`${c.area}: ${t}`, chip:imKpiChip(c)});
    });
  }
  if(ok.length) segs.push({texto:`Con normalidad: ${ok.map(c=>c.area).join(', ')}.`});
  segs.push({texto: pend
      ? (pend===1?'Tienes una pregunta esperando tu respuesta.':`Tienes ${pend} preguntas esperando tu respuesta.`)
      : 'No hay preguntas pendientes de tus Chiefs por ahora.'});
  segs.push({texto:`${on} agentes están activos ahora mismo.`});
  if(crit.length) segs.push({texto:`Si partes por algo, que sea ${crit[0].area}.`});
  segs.push({texto:'Ice Mind, fuera.'});
  return segs;
}

/* ── Selección de voz: prioriza motores que suenan menos robóticos ── */
function imVoz(){
  const vs=window.speechSynthesis?speechSynthesis.getVoices():[];
  if(!vs.length) return null;
  const es=vs.filter(v=>/^es/i.test(v.lang));
  const prefer=re=>es.find(v=>re.test(v.name));
  return prefer(/Google/i)
      || prefer(/Microsoft|Natural|Online/i)
      || es.find(v=>/es[-_]CL/i.test(v.lang))
      || es.find(v=>/es[-_](419|US|MX)/i.test(v.lang))
      || es[0] || vs.find(v=>/^es/i.test(v.lang)) || null;
}
function imBtn(t){ const b=document.getElementById('imPlay'); if(b) b.textContent=t; }

/* ── Habla un segmento y sigue con el siguiente al terminar ── */
function imHablarSeg(){
  const tr=document.getElementById('imTxt'), kr=document.getElementById('imKpis');
  if(imIdx>=imSegs.length){ imState='idle'; imBtn('↺ REPETIR'); return; }
  const seg=imSegs[imIdx];
  if(tr){
    const line=document.createElement('div');
    line.className='im-line';
    line.textContent=seg.texto;
    tr.appendChild(line);
    tr.scrollTop=tr.scrollHeight;
    requestAnimationFrame(()=>line.classList.add('im-in'));
  }
  if(seg.chip && kr){
    const chip=document.createElement('div');
    chip.className='im-chip';
    chip.style.setProperty('--cc',seg.chip.color);
    chip.innerHTML=`<b>${esc(seg.chip.code)}</b><span>${esc(seg.chip.label)}</span><em>${esc(seg.chip.value)}</em>`;
    kr.appendChild(chip);
    requestAnimationFrame(()=>chip.classList.add('im-in'));
  }
  if(!('speechSynthesis' in window)){
    imIdx++; setTimeout(imHablarSeg,900); return;
  }
  const utt=new SpeechSynthesisUtterance(seg.texto);
  const v=imVoz();
  if(v){ utt.voice=v; utt.lang=v.lang; } else { utt.lang='es-CL'; }
  utt.rate=0.99; utt.pitch=1.04; utt.volume=1;
  const mySeq=imSeq;
  utt.onstart=()=>{ imState='talking'; imBtn('⏸ PAUSAR'); };
  utt.onend=()=>{ if(mySeq!==imSeq) return; imIdx++; setTimeout(imHablarSeg,140); };
  utt.onerror=()=>{ if(mySeq!==imSeq) return; imIdx++; setTimeout(imHablarSeg,140); };
  utt.onboundary=()=>{ imPulse=1; };
  speechSynthesis.speak(utt);
}
function imEmpezar(){
  imSeq++; imIdx=0; imState='talking';
  try{ speechSynthesis.cancel(); }catch(e){}
  const tr=document.getElementById('imTxt'), kr=document.getElementById('imKpis');
  if(tr) tr.innerHTML=''; if(kr) kr.innerHTML='';
  imHablarSeg();
}

function imOrbDraw(){
  if(!imRafOn) return;
  const cv=document.getElementById('imOrb');
  const im=document.getElementById('iceMind');
  if(cv&&im&&im.classList.contains('open')){
    const ctx=cv.getContext('2d');
    const W=cv.width, H=cv.height, cx=W/2, cy=H/2;
    const t=performance.now()/1000;
    const amp=(imState==='talking'?1:.28)+imPulse*1.4;
    imPulse*=.9;
    ctx.clearRect(0,0,W,H);

    let g=ctx.createRadialGradient(cx,cy,20,cx,cy,150);
    g.addColorStop(0,'rgba(79,214,255,.30)');
    g.addColorStop(.55,'rgba(47,141,255,.10)');
    g.addColorStop(1,'rgba(47,141,255,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,150,0,Math.PI*2); ctx.fill();

    ctx.beginPath();
    for(let i=0;i<=120;i++){
      const a=i/120*Math.PI*2;
      const n=Math.sin(a*6+t*5)*3 + Math.sin(a*11-t*7)*2.4 + Math.sin(a*17+t*3)*1.6;
      const r=104 + n*amp*2.2 + Math.sin(t*1.6)*2;
      const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle='rgba(79,214,255,'+(0.35+amp*0.3)+')';
    ctx.lineWidth=1.6;
    ctx.shadowColor='rgba(79,214,255,.8)'; ctx.shadowBlur=12*amp;
    ctx.stroke(); ctx.shadowBlur=0;

    ctx.strokeStyle='rgba(79,214,255,.16)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.ellipse(cx,cy,128,52,t*.35,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx,cy,128,52,-t*.28+1.2,0,Math.PI*2); ctx.stroke();
    for(let i=0;i<22;i++){
      const a=t*(.5+(i%5)*.14)+i*(Math.PI*2/22);
      const rr=118+Math.sin(t*2+i)*7;
      const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr*.42*Math.sin(t*.35+i);
      ctx.beginPath(); ctx.arc(x,cy+(y-cy),1.6+((i%3)*.5),0,Math.PI*2);
      ctx.fillStyle='rgba(140,225,255,'+(0.3+(i%4)*.12)+')'; ctx.fill();
    }

    const R=56 + Math.sin(t*2.1)*3 + amp*8;
    g=ctx.createRadialGradient(cx-R*.3,cy-R*.35,R*.1,cx,cy,R);
    g.addColorStop(0,'rgba(210,245,255,.95)');
    g.addColorStop(.35,'rgba(110,215,255,.9)');
    g.addColorStop(.75,'rgba(47,141,255,.85)');
    g.addColorStop(1,'rgba(20,70,160,.6)');
    ctx.shadowColor='rgba(79,214,255,.9)'; ctx.shadowBlur=30+amp*24;
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;

    ctx.strokeStyle='rgba(230,250,255,.35)'; ctx.lineWidth=1;
    for(let i=0;i<5;i++){
      ctx.beginPath();
      for(let j=0;j<=30;j++){
        const a=-Math.PI/2 + j/30*Math.PI + i;
        const r=R*(0.35+0.5*Math.sin(j/30*Math.PI))*(0.9+0.1*Math.sin(t*3+i*2));
        const x=cx+Math.cos(a+t*.4+i)*r, y=cy+Math.sin(a+t*.4+i)*r;
        j?ctx.lineTo(x,y):ctx.moveTo(x,y);
      }
      ctx.stroke();
    }
  }
  requestAnimationFrame(imOrbDraw);
}

function imAbrir(){
  const im=document.getElementById('iceMind'); if(!im) return;
  imSegs=imSegmentos();
  im.classList.add('open');
  if(!imRafOn){ imRafOn=true; requestAnimationFrame(imOrbDraw); }
  if('speechSynthesis' in window && speechSynthesis.getVoices().length===0){
    let ya=false;
    speechSynthesis.onvoiceschanged=()=>{ if(!ya){ ya=true; imEmpezar(); } };
    setTimeout(()=>{ if(!ya){ ya=true; imEmpezar(); } },600);
  } else imEmpezar();
}
function imCerrar(){
  const im=document.getElementById('iceMind'); if(!im) return;
  im.classList.remove('open');
  imSeq++; imState='idle'; imPulse=0;
  try{ speechSynthesis.cancel(); }catch(e){}
}
function imToggle(){
  if(!('speechSynthesis' in window)) return;
  if(imState==='talking'){ speechSynthesis.pause(); imState='paused'; imBtn('▶ CONTINUAR'); }
  else if(imState==='paused'){ speechSynthesis.resume(); imState='talking'; imBtn('⏸ PAUSAR'); }
  else imEmpezar();
}
function imInit(){
  const c=document.getElementById('imClose'), p=document.getElementById('imPlay'), im=document.getElementById('iceMind');
  if(c) c.onclick=imCerrar;
  if(p) p.onclick=imToggle;
  if(im) im.addEventListener('click',e=>{ if(e.target===im) imCerrar(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') imCerrar(); });
}




/* ══════════════════════════════════════════════════════════
   AGENTES Y HORARIOS — resumen de la flota agrupado por Chief,
   con el disparador (horario) de cada agente. Vive como overlay
   independiente del Ice Mind, para no mezclar "escuchar" con "leer".
   ══════════════════════════════════════════════════════════ */
function agBloqueChief(c){
  const propios=byChief(c.id);
  const activos=propios.filter(a=>a.status==='activo').length;
  const col=colorCx(c), m=metaDe(c);
  const filas=propios.length
    ? propios.map(a=>`<div class="ag-row">
        <span class="ag-dot" style="background:${a.status==='activo'?'var(--live)':'var(--idle)'}"></span>
        <span class="ag-name">${esc(a.name||'Sin nombre')}</span>
        <span class="ag-trig">${esc(a.trigger||'sin horario definido')}</span>
        <span class="ag-last">${esc(a.lastRun?('última corrida '+a.lastRun):'sin registro')}</span>
      </div>`).join('')
    : `<div class="ag-row ag-empty">Sin agentes asignados todavía.</div>`;
  return `<div class="ag-block">
    <div class="ag-head">
      <span class="ag-code" style="--cc:${col}">${esc(c.code)}</span>
      <b>${esc(c.area)}</b>
      <span class="ag-state" style="color:${m.color}">${m.label}</span>
      <span class="ag-count">${activos}/${propios.length} activos</span>
    </div>
    <div class="ag-onel">${esc(c.oneLiner||'')}</div>
    ${filas}
  </div>`;
}
function agContenido(){
  const total=Base.datos.agentes.length;
  const activos=Base.datos.agentes.filter(a=>a.status==='activo').length;
  const pend=CHIEFS().reduce((n,c)=>n+listaDe(c,'questions').length,0);
  return `<div class="ag-summary">
      <div><b>${activos}</b><span>de ${total} agentes activos</span></div>
      <div><b>${pend}</b><span>pregunta${pend===1?'':'s'} pendiente${pend===1?'':'s'}</span></div>
      <div><b>${CHIEFS().length}</b><span>Chiefs cubiertos</span></div>
    </div>
    <div class="ag-list">${ringOrder().map(agBloqueChief).join('')}</div>`;
}
function agAbrir(){
  const ov=document.getElementById('agSummary'); if(!ov) return;
  document.getElementById('agBody').innerHTML=agContenido();
  ov.classList.add('open');
}
function agCerrar(){
  const ov=document.getElementById('agSummary'); if(!ov) return;
  ov.classList.remove('open');
}
function agInit(){
  const c=document.getElementById('agClose'), ov=document.getElementById('agSummary');
  if(c) c.onclick=agCerrar;
  if(ov) ov.addEventListener('click',e=>{ if(e.target===ov) agCerrar(); });
}

function wire(){
  const $=s=>document.querySelectorAll(s);
  $('[data-layout]').forEach(b=>b.onclick=()=>{S.layout=b.dataset.layout;render();});
  $('[data-meet]').forEach(b=>b.onclick=()=>{S.meet=b.dataset.meet;render();});
  const rA=document.getElementById('reunA'), rB=document.getElementById('reunB'), rT=document.getElementById('reunTema');
  if(rA) rA.onchange=()=>{S.reunA=rA.value;};
  if(rB) rB.onchange=()=>{S.reunB=rB.value;};
  if(rT) rT.oninput=()=>{S.reunTema=rT.value;};
  const rG=document.getElementById('reunGenerar');
  if(rG) rG.onclick=async()=>{
    const a=(rA?rA.value:S.reunA), b=(rB?rB.value:S.reunB), tema=(rT?rT.value.trim():S.reunTema.trim());
    if(a===b){ avisar('Elige dos Chiefs distintos.',true); return; }
    const resultado=generarDialogo(a,b,tema);
    const r=await Base.crearReunion({chiefs:[a,b],tema,resultado});
    render();
    avisar(r.local?'Conversación generada — solo en esta sesión, sin base.'
          : !r.ok?'No se pudo guardar: '+r.error
          : 'Conversación generada y guardada.', !r.ok||r.local);
  };
  $('[data-day]').forEach(b=>b.onclick=()=>{S.dayMode=b.dataset.day;render();});
  $('[data-daychief]').forEach(b=>b.onclick=()=>{S.dayChief=b.dataset.daychief||null;render();});
  $('[data-goto]').forEach(b=>b.onclick=()=>{S.view=b.dataset.goto;render();});
  $('[data-chief]').forEach(b=>b.onclick=()=>{S.chiefId=b.dataset.chief;S.view='chief';render();});
  $('[data-edit]').forEach(b=>b.onclick=()=>{
    S.editing=JSON.parse(JSON.stringify(Base.datos.agentes.find(x=>x.id===b.dataset.edit)));render();});
  $('[data-toggle]').forEach(b=>b.onclick=async()=>{
    const ag=Base.datos.agentes.find(x=>x.id===b.dataset.toggle);
    const antes=ag.status;
    ag.status=antes==='activo'?'pausado':'activo'; render();
    const r=await Base.guardarAgente(ag,Base.datos.agentes.indexOf(ag));
    if(!r.ok){ ag.status=antes; render(); avisar('No se pudo guardar: '+r.error,true); }
    else avisar((ag.status==='activo'?'Agente activado':'Agente en pausa')
          +(r.local?' — solo en esta sesión, sin base.':'.'), !!r.local);});
  $('[data-dup]').forEach(b=>b.onclick=async()=>{
    const orig=Base.datos.agentes.find(x=>x.id===b.dataset.dup);
    const copia=JSON.parse(JSON.stringify(orig));
    copia.id=uid(); copia.name=orig.name+' (copia)'; copia.status='pausado';
    copia.dependsOn=''; copia.lastRun='';
    const pos=Base.datos.agentes.indexOf(orig)+1;
    Base.datos.agentes.splice(pos,0,copia); render();
    const r=await Base.guardarAgente(copia,pos);
    avisar(!r.ok?'No se pudo guardar: '+r.error
          : r.local?'Duplicado solo en esta sesión, sin base.'
          : 'Agente duplicado, queda en pausa.', !r.ok||r.local);});
  $('[data-del]').forEach(b=>b.onclick=async()=>{
    const ag=Base.datos.agentes.find(x=>x.id===b.dataset.del);
    if(!confirm('Eliminar “'+ag.name+'”? No se puede deshacer.'))return;
    const r=await Base.borrarAgente(ag.id);
    avisar(!r.ok?'No se pudo eliminar: '+r.error
          : r.local?'Eliminado solo en esta sesión, sin base.'
          : 'Agente eliminado de Firestore.', !r.ok||r.local);});
  $('[data-newfor]').forEach(b=>b.onclick=()=>{S.editing=blank(b.dataset.newfor);render();});

  /* ── Estructura ── */
  $('[data-estchief]').forEach(b=>b.onclick=()=>{S.chiefId=b.dataset.estchief;render();});

  const leerEstructura=()=>{
    const e={kpis:[],metricas:[],bloques:[]};
    document.querySelectorAll('[data-kl]').forEach(inp=>{
      const i=+inp.dataset.kl;
      const nota=document.querySelector('[data-kn="'+i+'"]');
      e.kpis[i]={label:inp.value.trim(),note:nota?nota.value.trim():''};
    });
    document.querySelectorAll('[data-ml]').forEach(inp=>{
      e.metricas[+inp.dataset.ml]={label:inp.value.trim()};
    });
    e.bloques=[];
    document.querySelectorAll('[data-bt]').forEach(inp=>{
      const i=+inp.dataset.bt;
      const tipo=document.querySelector('[data-bp="'+i+'"]');
      e.bloques[i]={titulo:inp.value.trim(),tipo:tipo?tipo.value:'texto'};
    });
    e.kpis=e.kpis.filter(Boolean); e.metricas=e.metricas.filter(Boolean);
    e.bloques=e.bloques.filter(Boolean);
    return e;
  };
  const aplicar=e=>{ const c=chief(S.chiefId); c.estructura=e; render(); };

  const kadd=document.getElementById('kadd');
  if(kadd) kadd.onclick=()=>{const e=leerEstructura();e.kpis.push({label:'',note:''});aplicar(e);};
  const badd=document.getElementById('badd');
  if(badd) badd.onclick=()=>{const e=leerEstructura();e.bloques.push({titulo:'',tipo:'texto'});aplicar(e);};
  $('[data-bdel]').forEach(b=>b.onclick=()=>{const e=leerEstructura();e.bloques.splice(+b.dataset.bdel,1);aplicar(e);});

  const madd=document.getElementById('madd');
  if(madd) madd.onclick=()=>{const e=leerEstructura();e.metricas.push({label:''});aplicar(e);};
  $('[data-kdel]').forEach(b=>b.onclick=()=>{const e=leerEstructura();e.kpis.splice(+b.dataset.kdel,1);aplicar(e);});
  $('[data-mdel]').forEach(b=>b.onclick=()=>{const e=leerEstructura();e.metricas.splice(+b.dataset.mdel,1);aplicar(e);});
  $('[data-ksube]').forEach(b=>b.onclick=()=>{const e=leerEstructura(),i=+b.dataset.ksube;
    [e.kpis[i-1],e.kpis[i]]=[e.kpis[i],e.kpis[i-1]];aplicar(e);});
  $('[data-kbaja]').forEach(b=>b.onclick=()=>{const e=leerEstructura(),i=+b.dataset.kbaja;
    [e.kpis[i+1],e.kpis[i]]=[e.kpis[i],e.kpis[i+1]];aplicar(e);});

  const pg2=document.getElementById('panelesguardar');
  if(pg2) pg2.onclick=async()=>{
    const filas=[...document.querySelectorAll('[data-panelurl]')];
    const malas=filas.filter(i=>i.value.trim()&&!/^https?:\/\//i.test(i.value.trim()));
    if(malas.length){ avisar('Hay '+malas.length+' dirección(es) que no empiezan con https://',true); return; }
    let fallo=null, puestos=0;
    for(const inp of filas){
      const id=inp.dataset.panelurl, url=inp.value.trim();
      const ch=chief(id);
      if(panelDe(ch)===url) continue;          /* no reescribe lo que no cambió */
      ch.dashboard=url;
      const r=await Base.guardarCampos(id,{dashboard:url});
      if(!r.ok) fallo=r.error; else puestos++;
    }
    render();
    avisar(fallo?('No se pudo guardar: '+fallo)
          : puestos?(puestos+' panel(es) guardado(s).')
          : 'No había cambios que guardar.', !!fallo);};

  $('[data-panelset]').forEach(b=>b.onclick=()=>{
    S.chiefId=b.dataset.panelset; S.view='estructura'; render();
    setTimeout(()=>{const i=document.querySelector('[data-panelurl="'+S.chiefId+'"]');
      if(i){ i.scrollIntoView({block:'center'}); i.focus(); }},60);});

  const eg=document.getElementById('estguardar');
  if(eg) eg.onclick=async()=>{
    const c=chief(S.chiefId), e=leerEstructura();
    if(e.kpis.some(k=>!k.label)){ avisar('Hay un KPI sin nombre.',true); return; }
    c.estructura=e; render();
    const r=await Base.guardarEstructura(c.id,e);
    avisar(!r.ok?'No se pudo guardar: '+r.error
          : r.local?'Guardado solo en esta sesión, sin base.'
          : 'Estructura de '+c.area+' guardada en Firestore.', !r.ok||r.local);};

  const et=document.getElementById('esttodos');
  if(et) et.onclick=async()=>{
    const e=leerEstructura();
    if(!confirm('Aplicar esta estructura a los 8 Chiefs? Reemplaza la que tengan definida.')) return;
    let fallo=null;
    for(const c of CHIEFS()){
      c.estructura=JSON.parse(JSON.stringify(e));
      const r=await Base.guardarEstructura(c.id,e);   /* el panel no se copia: es de cada área */
      if(!r.ok) fallo=r.error;
    }
    render();
    avisar(fallo?('No se pudo guardar: '+fallo):'Estructura aplicada a los 8 Chiefs.',!!fallo);};

  const cp=document.getElementById('copiar');
  if(cp) cp.onclick=async()=>{
    const txt=document.getElementById('contrato').textContent;
    try{ await navigator.clipboard.writeText(txt); avisar('Contrato copiado.'); }
    catch(e){
      const r=document.createRange(); r.selectNodeContents(document.getElementById('contrato'));
      const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
      avisar('Selecciónalo y copia con Cmd+C.');}};

  $('[data-panel]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.panel;
    S.panelAbierto[id]=!S.panelAbierto[id];
    render();});

  const p=document.getElementById('pres');
  if(p) p.onclick=()=>{S.presence=glifo()?'avatar':'glifo';render();};
  const th=document.getElementById('tema');
  if(th) th.onclick=()=>setTheme(S.theme==='dark'?'light':'dark');
  const nw=document.getElementById('new');
  if(nw) nw.onclick=()=>{S.editing=blank(S.fChief==='all'?'fin':S.fChief);render();};
  const sb=document.getElementById('sembrar');
  if(sb) sb.onclick=async()=>{
    if(!confirm('Sembrar la base con los datos de ejemplo? Escribe los 8 Chiefs, los agentes, el día y la reunión.'))return;
    S.sembrando=true; render();
    const r=await Base.sembrar();
    S.sembrando=false;
    avisar(r.ok?('Base sembrada: '+r.escritos+' documentos escritos.'):'No se pudo sembrar: '+r.error,!r.ok);};
  ['fChief','fModel','fStatus'].forEach(id=>{const el=document.getElementById(id);
    if(el) el.onchange=()=>{S[id]=el.value;render();};});
  const q=document.getElementById('q');
  if(q) q.oninput=()=>{S.q=q.value;const c=q.selectionStart;render();
    const n=document.getElementById('q');if(n){n.focus();n.setSelectionRange(c,c);}};
  const sa=document.getElementById('saveAns');
  if(sa) sa.onclick=async()=>{
    const resp={};
    document.querySelectorAll('[data-ans]').forEach(t=>{
      S.saved[t.dataset.ans]=t.value;
      resp[t.dataset.ans.split(':')[1]]=t.value;
    });
    const r=await Base.guardarRespuestas(S.chiefId,resp);
    avisar(r.ok?(r.local?'Respuestas guardadas solo en esta sesión (sin base).':'Respuestas guardadas en Firestore.')
                :'No se pudo guardar: '+r.error, !r.ok);};
}
function blank(cid){
  return {id:uid(),chiefId:cid,name:'',model:'Sonnet',status:'activo',trigger:'',dependsOn:'',
    inputs:[],outputs:[],prompt:'',lastRun:'',links:{claude:'https://claude.ai/new',dash:'',clickup:''}};
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.editing){S.editing=null;render();}});

</script>
