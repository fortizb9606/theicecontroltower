<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ice Mind · Torre de Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,75..125,100..900;1,75..125,100..900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#020a15; --ink:#eef7ff; --on-ink:#04101e; --paper:#081827; --soft:#0c2036;
  --line:rgba(96,190,255,.20); --hair:rgba(96,190,255,.10); --hover:#0d2440;
  --crit:#ff5063; --alert:#ff8b3d; --ok:#4fd6ff; --deep:#ff8567; --wash:#123252;
  --dim:#5f7891; --mid:#8fa6bc; --body:#b4c6d7;
  --live:#4be6a2; --idle:#3a5570;
  --sh1:0 4px 14px rgba(0,0,0,.45); --sh2:0 14px 40px rgba(0,0,0,.55);
  --sweep:rgba(79,214,255,.13); --crit-h:#ff6b7c;
  --band-ok:rgba(79,214,255,.035); --band-alert:rgba(255,139,61,.10); --band-crit:rgba(255,80,99,.16);
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --disp:"Space Grotesk","Archivo",system-ui,sans-serif;
  --cyan:#4fd6ff; --teal:#2ee6c8; --blue:#2f8dff;
}
[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--deep);text-decoration:none}
:focus-visible{outline:2px solid var(--crit);outline-offset:2px}
::selection{background:var(--wash)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line)}
::-webkit-scrollbar-track{background:transparent}
@keyframes sweep{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:0;transform:scale(2.4)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── shell ─────────────────────────── */
.shell{display:flex;min-height:100vh}
aside{width:262px;flex:0 0 262px;border-right:1px solid var(--line);display:flex;flex-direction:column;
  padding:24px 0;gap:26px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 20px 20px;border-bottom:1px solid var(--line)}
.brand i{width:28px;height:28px;background:var(--crit);display:block;flex:0 0 28px}
.brand b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em;text-transform:uppercase}
.brand span{display:block;font-size:10px;font-weight:600;letter-spacing:.16em;color:var(--ok);text-transform:uppercase;margin-top:2px}
.grp{display:flex;flex-direction:column}
.grplbl{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--ok);padding:0 20px 10px}
.nav{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-size:14px;font-weight:600;
  padding:11px 20px;border-left:3px solid transparent}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--soft);border-left-color:var(--crit)}
.nav em{font-size:11px;font-style:normal;font-weight:500;color:var(--dim)}
.nav .cnt{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim)}
.chiefitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border-top:1px solid var(--line);
  color:var(--body);font-size:14px;font-weight:500;padding:10px 20px}
.chiefitem:hover{background:var(--soft);color:var(--ink)}
.chiefitem i{width:8px;height:8px;flex:0 0 8px;display:block}
.chiefitem span:nth-child(2){flex:1;min-width:0}
.chiefitem .cd{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--dim)}
.foot{margin-top:auto;padding:16px 20px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.foot .l{font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--ok)}
.foot .b{font-size:22px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.foot .t{font-size:12px;color:var(--mid);line-height:1.5}

main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:20px 32px 18px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
header .sub{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--ok)}
header h1{margin-top:2px;font-size:26px;font-weight:800;letter-spacing:-.03em}
.hctl{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line)}
.seg button{padding:8px 16px;font-size:13px;font-weight:600;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:linear-gradient(180deg,rgba(47,141,255,.34),rgba(47,141,255,.10));color:var(--ink);box-shadow:inset 0 0 0 1px rgba(79,214,255,.5)}
.seg button:not(.on):hover{background:var(--soft)}
.tgl{border:1px solid var(--line);padding:8px 14px;font-size:11px;font-weight:700;letter-spacing:.12em}
.tgl:hover{background:var(--soft)}
.cta{background:var(--crit);border:2px solid var(--crit);color:#fff;padding:8px 18px;font-size:13px;font-weight:700}
.cta:hover{background:var(--crit-h);border-color:var(--crit-h)}
.legend{display:flex;align-items:center;gap:14px;font-size:12px;font-weight:600;color:var(--mid)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;display:block}
section.view{flex:1;padding:24px 32px 44px;display:flex;flex-direction:column;gap:18px;animation:rise .18s ease-out}
.lede{max-width:730px;font-size:14px;line-height:1.6;color:var(--mid)}
.lede strong{color:var(--ink);font-weight:700}

/* ── radar / sala ──────────────────── */
/* ── anillo 3-2-3: radar y sala ─────── */
.stage{position:relative;width:100%;
  height:700px;
  height:clamp(400px,calc(100vh - 228px),780px);
  height:clamp(400px,calc(100dvh - 228px),780px);
  border:1px solid var(--line);background:var(--paper);overflow:hidden}
.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.wires .b-ok{fill:var(--band-ok)}
.wires .b-alert{fill:var(--band-alert)}
.wires .b-crit{fill:var(--band-crit)}
.wires .w-crit{stroke:var(--crit)}
.wires .w-alert{stroke:var(--alert)}
.wires .w-ok{stroke:var(--ok)}
.wires .w-ring{stroke:var(--hair)}
.sweepwrap{position:absolute;left:50%;top:50%;margin-left:-1300px;margin-top:-1300px;
  width:2600px;height:2600px;pointer-events:none;z-index:0;overflow:hidden}
.sweepwrap i{display:block;width:100%;height:100%;border-radius:50%;
  background:conic-gradient(from 0deg,var(--sweep),rgba(0,0,0,0) 26%);
  animation:sweep 14s linear infinite}
.sweepfade{position:absolute;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 200px,var(--paper) 780px)}
.bandkey{position:absolute;left:16px;top:14px;z-index:4;display:flex;flex-direction:column;gap:5px}
.bandkey b{font-size:9px;font-weight:700;letter-spacing:.16em;color:var(--ok)}
.bandkey span{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:600;color:var(--mid)}
.bandkey i{width:14px;height:0;border-top-style:solid;flex:0 0 14px}
.bandkey s{text-decoration:none;color:var(--dim);font-size:9.5px}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3}
.hub .box{width:150px;height:112px;border:1px solid var(--line);background:var(--bg);display:flex;
  flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;padding:0 16px}
.hub .l{font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--ok)}
.hub .n{font-size:20px;font-weight:800;letter-spacing:-.025em}
.hub .p{font-size:11.5px;font-weight:700;color:var(--deep)}
.hub .s{font-size:10px;color:var(--ok);font-variant-numeric:tabular-nums}

.stage.plano{height:auto;border:0;background:transparent;overflow:visible;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));
  border-top:1px solid var(--line);border-left:1px solid var(--line)}
.stage.plano .wires,.stage.plano .sweepwrap,.stage.plano .sweepfade,
.stage.plano .hub,.stage.plano .table3d,.stage.plano .mesa,.stage.plano .bandkey{display:none}
.stage.plano .pod,.stage.plano .seat{position:static;transform:none;width:auto}
.stage.plano .card{height:auto;min-height:150px;border:0;border-right:1px solid var(--line);box-shadow:none}
.stage.plano .card:hover{transform:none;box-shadow:none}
.stage.plano .podbar{border:0;border-top:1px solid var(--line);
  border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.stage.plano .seat button{padding:16px;border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);height:100%}
.stage.plano .bubble{border:0;box-shadow:none;padding:0}
.stage.plano .seat button:hover .bubble{transform:none;box-shadow:none}
.pod{position:absolute;transform:translate(-50%,-50%);width:214px;z-index:2}
.pod:hover,.pod:focus-within{z-index:6}
.card{width:100%;height:160px;background:var(--paper);border:1px solid var(--line);padding:11px;
  text-align:left;display:flex;flex-direction:column;box-shadow:var(--sh1);
  transition:box-shadow .14s,transform .14s}
.card{cursor:pointer}
.card.rota{border-color:var(--deep);background:var(--wash)}
.card.rota .one{color:var(--deep)}
.card:hover{background:var(--hover);box-shadow:var(--sh2);transform:translateY(-2px)}
.card:hover .verdet{opacity:1}
.verdet{position:absolute;right:11px;bottom:11px;font-size:9px;font-weight:700;
  letter-spacing:.12em;color:var(--deep);opacity:0;transition:opacity .14s}
.pod .card{position:relative}
.podtop{display:flex;align-items:flex-start;gap:9px;width:100%}
.mark{border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-weight:700;letter-spacing:.06em;width:34px;height:34px;flex:0 0 34px;font-size:9px}
.podtop .nm{flex:1;min-width:0}
.podtop .nm b{display:block;font-size:14px;font-weight:700;letter-spacing:-.015em;line-height:1.14}
.podtop .nm s{display:block;text-decoration:none;margin-top:1px;font-size:9px;font-weight:700;letter-spacing:.13em}
.blip{position:relative;width:7px;height:7px;flex:0 0 7px;margin-top:3px}
.blip i,.blip u{position:absolute;inset:0;display:block}
.blip u{animation:pulse 2.8s ease-out infinite}
.one{margin-top:8px;font-size:12.5px;line-height:1.42;color:var(--body);text-wrap:pretty;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;flex:1;min-height:0}
.kk{display:flex;gap:14px;width:100%;border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.kk div{flex:1;min-width:0}
.kk s{display:block;text-decoration:none;font-size:8.5px;font-weight:700;letter-spacing:.14em;color:var(--ok)}
.kk b{display:block;font-size:18px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.podbar{display:flex;border:1px solid var(--line);border-top:0}
.podbar a,.podbar button{flex:1;text-align:center;font-size:9.5px;font-weight:700;letter-spacing:.09em;
  padding:8px 3px;border-right:1px solid var(--line);background:var(--bg);color:var(--ink);white-space:nowrap}
.podbar a:last-child,.podbar button:last-child{border-right:0}
.podbar a:hover,.podbar button:hover{background:var(--wash);color:var(--deep)}

.table3d{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) perspective(1000px) rotateX(60deg);
  width:34%;height:26%;border:1px solid var(--line);background:var(--soft)}
.mesa{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:250px;z-index:3}
.mesa .l{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--ok)}
.mesa .t{font-size:15px;font-weight:700;margin-top:4px;line-height:1.3}
.seat{position:absolute;transform:translate(-50%,-50%);width:226px;z-index:2}
.seat:hover,.seat:focus-within{z-index:6}
.seat button{width:100%;display:flex;flex-direction:column;gap:9px;text-align:left}
.bubble{background:var(--paper);border:1px solid var(--line);padding:12px;
  box-shadow:var(--sh1);transition:box-shadow .14s,transform .14s}
.seat button:hover .bubble{box-shadow:var(--sh2);transform:translateY(-2px)}
.bubble .q{font-size:12.5px;line-height:1.42;color:var(--body);text-wrap:pretty;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.bubble .kv{display:flex;gap:14px;margin-top:9px;border-top:1px solid var(--line);padding-top:8px}
.bubble .kv span{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.bubble .kv s{text-decoration:none;font-weight:600;color:var(--ok);font-size:11px}
.who{display:flex;align-items:center;gap:10px}
.who .mark{width:40px;height:40px;flex:0 0 40px;font-size:10px;animation:bob 5s ease-in-out infinite}
.who .txt2{min-width:0}
.who b{display:block;font-size:14px;font-weight:700;line-height:1.15}
.who s{display:block;text-decoration:none;font-size:10px;font-weight:700;letter-spacing:.1em}

/* ── muro ──────────────────────────── */
.wall{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.tile{border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper);padding:20px;
  display:flex;flex-direction:column;gap:14px}
.tile .th{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.tile .st{font-size:10px;font-weight:700;letter-spacing:.18em}
.tile h3{font-size:28px;font-weight:800;letter-spacing:-.035em;margin-top:2px}
.tile .one{font-size:14px;line-height:1.5;color:var(--body);text-wrap:pretty;min-height:42px}
.tile .big{display:flex;gap:22px;border-top:1px solid var(--line);padding-top:12px}
.tile .big s{display:block;text-decoration:none;font-size:9px;font-weight:700;letter-spacing:.16em;color:var(--ok)}
.tile .big b{display:block;font-size:34px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.tile .meta{font-size:11px;font-weight:600;color:var(--ok)}
.tile .acts2{display:flex;margin-top:auto;border:1px solid var(--line)}
.tile .acts2 button,.tile .acts2 a{flex:1;text-align:center;padding:9px;font-size:12.5px;font-weight:700;
  border-left:1px solid var(--line);color:var(--ink)}
.tile .acts2 :first-child{border-left:0;background:linear-gradient(180deg,rgba(47,141,255,.34),rgba(47,141,255,.10));color:var(--ink);box-shadow:inset 0 0 0 1px rgba(79,214,255,.5)}
.tile .acts2 :first-child:hover{background:var(--body)}
.tile .acts2 a:hover{background:var(--wash);color:var(--deep)}
.tickbar{overflow:hidden;border-top:1px solid var(--line);padding:12px 0;margin-top:auto}
.tickbar div{display:flex;gap:40px;width:max-content;animation:ticker 44s linear infinite;font-size:12px;font-weight:600;color:var(--mid)}
.tickbar span{white-space:nowrap}

/* ── controles / formularios ───────── */
.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:linear-gradient(180deg,rgba(47,141,255,.34),rgba(47,141,255,.10));color:var(--ink);box-shadow:inset 0 0 0 1px rgba(79,214,255,.5);padding:9px 16px;font-size:11.5px;
  font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.btn:hover{background:var(--crit);border-color:var(--crit)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--soft);color:var(--ink);border-color:var(--ink)}
.btn.danger{background:transparent;color:var(--deep);border-color:var(--deep)}
.btn.danger:hover{background:var(--deep);color:var(--bg)}
.btn.sm{padding:5px 10px;font-size:10px;letter-spacing:.06em}
select,input[type=text],textarea{border:2px solid var(--line);background:var(--paper);padding:8px 10px;font-size:13px;width:100%}
select:focus,input:focus,textarea:focus{border-color:var(--ink)}
.field{margin-bottom:16px}
.field label{display:block;font-size:9.5px;font-weight:700;letter-spacing:.16em;color:var(--ok);margin-bottom:6px}
.field .hint{font-size:11px;color:var(--mid);margin-top:5px;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.notice{border:1px solid var(--line);background:var(--wash);padding:10px 14px;font-size:12.5px;font-weight:600}

/* ── panel externo embebido ────────── */
.web{border:1px solid var(--line);background:var(--paper);margin-bottom:22px}
.webh{display:flex;align-items:center;gap:12px;padding:10px 14px;
  border-bottom:1px solid var(--line);background:var(--soft);flex-wrap:wrap}
.webt{font-size:10px;font-weight:700;letter-spacing:.16em}
.weburl{font-family:var(--mono);font-size:10.5px;color:var(--ok);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.webf{display:block;width:100%;height:min(560px,60vh);border:0;background:var(--bg)}
.webpie{padding:9px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--mid)}
.podbar .panel-b{background:linear-gradient(180deg,rgba(47,141,255,.34),rgba(47,141,255,.10));color:var(--ink);box-shadow:inset 0 0 0 1px rgba(79,214,255,.5)}
.podbar .panel-b:hover{background:var(--crit);color:#fff}
.podbar .panel-b.sin{background:transparent;color:var(--dim);border-right:1px solid var(--line)}
.podbar .panel-b.sin:hover{background:var(--soft);color:var(--ink)}
.acts2 .sin{color:var(--dim)}
.acts2 .sin:hover{background:var(--soft);color:var(--ink)}

/* ── tablas de los bloques ─────────── */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:9px;font-weight:700;letter-spacing:.14em;color:var(--ok);
  padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 16px;border-bottom:1px solid var(--line);color:var(--body);
  font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--hover)}

/* ── contrato del agente ───────────── */
.contrato{font-family:var(--mono);font-size:11px;line-height:1.55;padding:14px 16px;
  white-space:pre-wrap;word-break:break-word;max-height:46vh;overflow:auto;
  border-top:1px solid var(--line);color:var(--body);background:var(--bg)}
code{font-family:var(--mono);font-size:.92em;background:var(--soft);padding:1px 5px}

/* ── aviso flotante ────────────────── */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:80;
  border:1px solid var(--line);background:linear-gradient(180deg,rgba(47,141,255,.34),rgba(47,141,255,.10));color:var(--ink);box-shadow:inset 0 0 0 1px rgba(79,214,255,.5);padding:11px 18px;
  font-size:13px;font-weight:600;max-width:min(560px,92vw);text-align:center;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.toast.ver{opacity:1;transform:translate(-50%,0)}
.toast.mal{background:var(--deep);border-color:var(--deep);color:#fff}

/* ── estado de la conexión ─────────── */
.conx{display:flex;align-items:center;gap:7px;border:1px solid var(--line);padding:7px 12px;
  font-size:10px;font-weight:700;letter-spacing:.12em}
.conx i{width:8px;height:8px;display:block;border-radius:50%}
.conx.viva i{background:var(--live)}
.conx.viva{border-color:var(--live);color:var(--live)}
.conx.vacia i{background:var(--alert)}
.conx.vacia{border-color:var(--alert);color:var(--deep)}
.conx.demo i{background:var(--dim)}
.conx.demo{border-color:var(--line);color:var(--ok)}
.aviso{border:1px solid var(--line);background:var(--wash);padding:12px 16px;font-size:13px;
  line-height:1.5;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.aviso b{font-weight:700}
.aviso .btn{margin-left:auto;flex:0 0 auto}
.pista{font-size:11px;color:var(--deep);font-weight:600}

/* ── agentes ───────────────────────── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border:1px solid var(--line)}
.stat{padding:14px 16px;border-right:1px solid var(--line);background:var(--paper)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:9px;letter-spacing:.14em;color:var(--ok);font-weight:700}
.chain{border:1px solid var(--line);background:var(--paper)}
.chainhead{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--soft)}
.code{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--cyan);background:rgba(79,214,255,.10);border:1px solid rgba(79,214,255,.4);border-radius:6px;padding:3px 7px;font-family:var(--mono)}
.chainhead h3{font-size:14px;font-weight:800;letter-spacing:-.01em}
.chainhead .n{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ok)}
.agent{display:flex;gap:16px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.agent:last-child{border-bottom:0}
.agent:hover{background:var(--hover)}
.agent.off{opacity:.5}
.step{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--dim);padding-top:2px;width:20px;flex:0 0 20px}
.agent .meat{flex:1;min-width:0}
.agent h4{font-size:14.5px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.model{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.1em;border:1.5px solid var(--ink);padding:2px 6px}
.model.opus{background:linear-gradient(180deg,rgba(47,141,255,.34),rgba(47,141,255,.10));color:var(--ink);box-shadow:inset 0 0 0 1px rgba(79,214,255,.5)}
.model.haiku{background:var(--soft)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.trig{font-family:var(--mono);font-size:11px;color:var(--mid);margin-top:5px;line-height:1.5}
.io{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:10.5px;border:1px solid var(--line);padding:2px 7px;color:var(--mid);background:var(--bg)}
.tag.out{border-color:var(--deep);color:var(--deep)}
.acts{display:flex;gap:5px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end;max-width:184px}
.empty{border:2px dashed var(--line);padding:40px 24px;text-align:center;color:var(--mid);font-size:14px}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:6px;font-weight:700}

/* ── drawer ────────────────────────── */
.veil{position:fixed;inset:0;background:rgba(32,30,29,.55);display:flex;justify-content:flex-end;z-index:50}
.drawer{width:min(560px,100%);background:var(--bg);height:100%;overflow-y:auto;border-left:1px solid var(--line);animation:rise .16s ease-out}
.drawer .dh{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:18px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;z-index:2}
.drawer .dh h2{font-size:19px;font-weight:800;letter-spacing:-.02em}
.drawer .dh .sub{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--ok)}
.drawer .db{padding:22px 24px 40px}
.drawer .df{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:14px 24px;display:flex;gap:10px;align-items:center}
.taglist{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.taglist .tag{display:flex;align-items:center;gap:6px;background:var(--paper);font-size:11.5px;padding:4px 8px}
.taglist .tag button{color:var(--deep);font-weight:800;font-size:13px;line-height:1}
.addrow{display:flex;gap:6px}

/* ── paneles compartidos ───────────── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));border:1px solid var(--line)}
.kpi{padding:14px 16px;border-right:1px solid var(--line);background:var(--paper)}
.kpi:last-child{border-right:0}
.kpi span{display:block;font-size:9px;letter-spacing:.14em;color:var(--ok);font-weight:700}
.kpi b{display:block;font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:3px 0;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:11px;color:var(--mid)}
.split{display:grid;grid-template-columns:1.55fr 1fr;gap:22px;align-items:start}
.panel{border:1px solid var(--line);background:var(--paper)}
.panel h3{font-size:10px;letter-spacing:.16em;font-weight:700;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--soft)}
.row{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.row:last-child{border-bottom:0}
.row .t{font-family:var(--mono);font-size:10.5px;color:var(--dim);flex:0 0 46px;padding-top:2px}
.row .txt{font-size:13px;line-height:1.5;flex:1;min-width:0}
.row .meta{font-family:var(--mono);font-size:10px;color:var(--ok);margin-top:4px;display:block}
.mrow{padding:13px 16px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .lh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px}
.mrow .lh b{font-size:16px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mrow .bar2{height:5px;background:var(--soft);margin-top:7px}
.mrow .bar2 i{display:block;height:100%}
.mrow .d{font-size:11px;margin-top:5px}
.dayblock{border:1px solid var(--line);background:var(--paper);margin-bottom:18px}
.dayblock .dbh{display:flex;align-items:center;gap:11px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dayblock .dbh h3{font-size:14.5px;font-weight:800}
.dayblock .read{padding:13px 16px;font-size:13.5px;line-height:1.55;border-bottom:1px solid var(--line);color:var(--mid)}
.quote{border:1px solid var(--line);background:var(--paper);padding:18px}
.quote p{font-size:17px;line-height:1.5;font-weight:600;letter-spacing:-.01em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);padding:6px 13px;font-size:10.5px;font-weight:700;letter-spacing:.1em}
.chip.on{background:linear-gradient(180deg,rgba(47,141,255,.34),rgba(47,141,255,.10));color:var(--ink);box-shadow:inset 0 0 0 1px rgba(79,214,255,.5)}

/* Pantalla de alto medio: la órbita sigue, en versión compacta. */
@media(max-height:880px) and (min-width:1201px){
  header{padding:14px 32px 12px}
  header h1{font-size:22px}
  section.view{padding:16px 32px 20px;gap:12px}
  .lede{font-size:13px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
  .stage{height:560px;
    height:clamp(360px,calc(100vh - 152px),660px);
    height:clamp(360px,calc(100dvh - 152px),660px)}
  .card{height:122px;padding:9px}
  .one{-webkit-line-clamp:2;margin-top:5px;font-size:11.5px;line-height:1.38}
  .kk{padding-top:5px;margin-top:5px}
  .kk b{font-size:15px}
  .kk s{font-size:8px}
  .podtop .nm b{font-size:13px}
  .mark{width:30px;height:30px;flex:0 0 30px}
  .podbar a,.podbar button{padding:6px 3px;font-size:9px}
  .hub .box{width:140px;height:92px;padding:0 13px}
  .hub .n{font-size:17px}
  .hub .p{font-size:11px}
  .hub .s{font-size:9.5px}
  .seat{width:214px}
  .bubble .q{-webkit-line-clamp:2}
  .bubble .kv span{font-size:11px}
  .who .mark{width:34px;height:34px;flex:0 0 34px}
  .sweepfade{background:radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 140px,var(--paper) 600px)}
}
/* La grilla se activa por medición (clase .plano), no por umbral de pantalla.
   Solo se fuerza cuando la barra lateral se apila arriba. */
@media(max-width:1000px){
  .stage{height:auto}
}
@media(max-width:1000px){
  .split{grid-template-columns:1fr}
  .shell{flex-direction:column}
  aside{width:100%;flex:none;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}
  .foot{margin-top:16px}
  .acts{max-width:none;justify-content:flex-start}
  .agent{flex-wrap:wrap}
}
@media(max-width:640px){
  section.view,header{padding-left:16px;padding-right:16px}
  header h1{font-size:22px}
  .grid2{grid-template-columns:1fr}
  .hctl{gap:8px}
  .seg button{padding:7px 11px;font-size:12px}
}
/* ══════════════════════════════════════════════════════════════════
   CEREBRO OPERATIVO — vista "cerebro" de la torre.
   Tablero siempre oscuro (es un monitor), independiente del tema.
   Todo namespaced con cx- para no chocar con el resto del app.
   ══════════════════════════════════════════════════════════════════ */
.cx-dash{
  --cxbg:#020a15; --cxtext:#eef7ff; --cxmuted:#8fa6bc; --cxdim:#5f7891;
  --cxcyan:#4fd6ff; --cxred:#ff5063; --cxorange:#ff8b3d; --cxgreen:#4be6a2;
  --cxmono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --cxdisp:"Space Grotesk","Archivo",system-ui,sans-serif;
  position:relative; color:var(--cxtext);
  aspect-ratio:1.93; min-height:760px; max-height:980px;
  border:1px solid rgba(83,180,245,.18); border-radius:22px; overflow:hidden;
  background:
    radial-gradient(circle at 50% 55%, rgba(22,116,208,.15), transparent 36%),
    radial-gradient(circle at 50% 108%, rgba(30,90,200,.12), transparent 40%),
    linear-gradient(180deg, #041020, #020a15);
  box-shadow:0 22px 60px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.02);
  isolation:isolate;
  font-family:Inter,"Archivo",system-ui,sans-serif;
}
.cx-dash::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.7;z-index:0;
  background:radial-gradient(circle at 50% 52%, transparent 0 22%, rgba(79,214,255,.05) 22.2% 22.45%, transparent 22.7% 31%, rgba(79,214,255,.035) 31.2% 31.45%, transparent 31.7% 40%, rgba(79,214,255,.025) 40.2% 40.4%, transparent 40.6%);
}
.cx-dash::after{
  content:"";position:absolute;inset:auto 12% 3% 12%;height:24%;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at center, rgba(37,150,255,.16), transparent 64%);
  filter:blur(26px);
}
#cxCanvas{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.85}
.cx-dash.cx-nopart #cxCanvas{display:none}
.cx-decor{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.cx-dash.cx-nomol .cx-decor{display:none}
.cx-decor .cx-far{filter:blur(2.2px);opacity:.5}
.cx-bin{
  position:absolute;color:rgba(79,190,255,.15);font-family:var(--cxmono);
  font-size:8.5px;line-height:1.9;letter-spacing:.14em;writing-mode:vertical-rl;user-select:none;
}

/* escenario del cerebro */
.cx-stage{
  position:absolute;left:50%;top:50%;
  width:min(46%,640px);aspect-ratio:1.18;
  transform:translate(-50%,-50%);z-index:4;
  display:grid;place-items:center;
  filter:drop-shadow(0 30px 46px rgba(0,0,0,.32));
}
.cx-stage::before{
  content:"";position:absolute;width:86%;height:86%;border-radius:50%;z-index:-1;
  background:radial-gradient(circle at 50% 48%, rgba(72,198,255,.20), rgba(56,120,255,.10) 38%, transparent 68%);
  filter:blur(26px);animation:cxBreathe 7s ease-in-out infinite;
}
.cx-stage::after{
  content:"";position:absolute;width:76%;height:18%;bottom:-4%;
  border:1px solid rgba(79,214,255,.20);border-radius:50%;
  background:radial-gradient(ellipse at center, rgba(47,141,255,.26), rgba(47,141,255,.10) 36%, transparent 72%);
  box-shadow:0 0 46px rgba(47,141,255,.15);
  transform:perspective(520px) rotateX(66deg);
}
.cx-brain{width:100%;height:100%;overflow:visible}
.cx-outline{
  fill:url(#cxBrainBase);
  stroke:rgba(126,224,255,.75);stroke-width:2;vector-effect:non-scaling-stroke;
  filter:url(#cxGlow);
}
.cx-zone{
  fill:rgba(15,58,99,.34);
  stroke:rgba(104,212,255,.30);stroke-width:1.1;vector-effect:non-scaling-stroke;
  transition:fill .28s ease, stroke .28s ease, filter .28s ease, opacity .28s ease;
  opacity:.9;pointer-events:auto;
}
.cx-zone.cx-on{
  fill:color-mix(in srgb, var(--cxa) 58%, rgba(14,49,83,.78));
  stroke:color-mix(in srgb, var(--cxa) 90%, white 10%);
  filter:drop-shadow(0 0 10px var(--cxa)) drop-shadow(0 0 24px color-mix(in srgb, var(--cxa) 55%, transparent));
  opacity:1;
}
.cx-fiber{fill:none;stroke:rgba(112,206,255,.30);stroke-width:1.1;stroke-linecap:round;vector-effect:non-scaling-stroke}
.cx-ridge{
  fill:none;stroke:rgba(168,232,255,.5);stroke-width:1.55;
  stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;
  filter:url(#cxGlow);
}
.cx-ridge.cx-fine{stroke-width:.95;stroke:rgba(146,218,255,.3);filter:none}
.cx-spark{fill:var(--cxcyan);opacity:.7;filter:drop-shadow(0 0 4px var(--cxcyan));animation:cxBlink 3.2s ease-in-out infinite}
.cx-syn{fill:#bdf1ff;filter:drop-shadow(0 0 5px var(--cxcyan)) drop-shadow(0 0 10px rgba(79,214,255,.5))}
.cx-dust circle{transition:opacity .3s ease}
.cx-brain[data-on] .cx-dust circle{opacity:.16}
.cx-brain[data-on="fin"] .cx-dust circle[data-z="fin"],
.cx-brain[data-on="rev"] .cx-dust circle[data-z="rev"],
.cx-brain[data-on="vta"] .cx-dust circle[data-z="vta"],
.cx-brain[data-on="mkt"] .cx-dust circle[data-z="mkt"],
.cx-brain[data-on="prd"] .cx-dust circle[data-z="prd"],
.cx-brain[data-on="dst"] .cx-dust circle[data-z="dst"],
.cx-brain[data-on="rrhh"] .cx-dust circle[data-z="rrhh"],
.cx-brain[data-on="leg"] .cx-dust circle[data-z="leg"]{opacity:1}

/* núcleo */
.cx-core{
  position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
  width:198px;padding:11px 14px;border-radius:15px;z-index:9;
  background:linear-gradient(180deg, rgba(8,28,48,.97), rgba(4,18,33,.96));
  border:1px solid rgba(79,214,255,.66);
  box-shadow:0 0 0 5px rgba(79,214,255,.05), 0 0 42px rgba(47,141,255,.26), 0 22px 60px rgba(0,0,0,.4);
}
.cx-core .cx-live{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--cxgreen);box-shadow:0 0 12px var(--cxgreen)}
.cx-core .cx-live.cx-demo{background:var(--cxorange);box-shadow:0 0 12px var(--cxorange)}
.cx-core .cx-badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 6px;
  border:1px solid rgba(79,214,255,.34);border-radius:6px;color:var(--cxcyan);
  font-family:var(--cxmono);font-size:8.5px;letter-spacing:.1em;font-weight:700;
}
.cx-core h2{margin:6px 0 3px;font-family:var(--cxdisp);font-weight:600;font-size:19px;letter-spacing:-.02em;color:var(--cxtext)}
.cx-core .cx-pend{color:var(--cxred);font-weight:800;font-size:11.5px}
.cx-core .cx-ag{color:var(--cxmuted);font-size:10.5px;margin-top:3px}

/* conectores */
.cx-conn{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:visible}
.cx-cg{--cxa:var(--cxcyan)}
.cx-halo{fill:none;stroke:rgba(64,175,255,.12);stroke-width:15;stroke-linecap:round;stroke-linejoin:round}
.cx-line{
  fill:none;stroke:rgba(96,214,255,.55);stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;opacity:.8;
  transition:stroke .25s ease, opacity .25s ease, filter .25s ease, stroke-width .25s ease;
}
.cx-cg.cx-on .cx-line{
  stroke:var(--cxa);stroke-width:2.3;opacity:1;
  filter:drop-shadow(0 0 6px var(--cxa)) drop-shadow(0 0 14px color-mix(in srgb, var(--cxa) 36%, transparent));
}
.cx-pulse{
  fill:none;stroke:var(--cxa);stroke-width:2.7;
  stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:16 22;opacity:0;
  filter:drop-shadow(0 0 7px var(--cxa));
}
.cx-cg.cx-on .cx-pulse{opacity:.9;animation:cxFlow 1.6s linear infinite}
.cx-cdot{fill:rgba(79,214,255,.5);transition:.25s ease}
.cx-cg.cx-on .cx-cdot{fill:var(--cxa);filter:drop-shadow(0 0 8px var(--cxa))}
.cx-anchor{fill:rgba(14,30,47,.96);stroke:rgba(84,196,255,.28);stroke-width:1.1}

/* tarjetas */
.cx-card{
  --cc:var(--cxcyan);
  position:absolute;width:226px;z-index:7;overflow:hidden;
  border:1px solid rgba(91,170,219,.30);border-radius:15px;
  background:linear-gradient(180deg, rgba(6,24,41,.93), rgba(4,17,29,.91));
  box-shadow:0 15px 45px rgba(0,0,0,.24);
  transition:transform .26s ease, border-color .26s ease, box-shadow .26s ease, background .26s ease;
}
.cx-card::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.75;
  background:radial-gradient(circle at 86% 4%, color-mix(in srgb, var(--cc) 15%, transparent), transparent 32%);
}
.cx-card::after{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg, var(--cc), transparent 80%);opacity:.55;
}
.cx-card:hover,.cx-card:focus-within,.cx-card.cx-on{
  transform:translateY(-5px) scale(1.014);
  border-color:color-mix(in srgb, var(--cc) 75%, white 8%);
  box-shadow:0 0 0 1px color-mix(in srgb, var(--cc) 25%, transparent), 0 14px 40px rgba(0,0,0,.3), 0 0 36px color-mix(in srgb, var(--cc) 28%, transparent);
  background:linear-gradient(180deg, color-mix(in srgb, var(--cc) 9%, rgba(6,24,41,.96)), rgba(4,17,29,.94));
  z-index:12;
}
.cx-cmain{padding:10px 12px 6px;position:relative}
.cx-chead{display:grid;grid-template-columns:32px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:inherit}
.cx-code{
  width:32px;height:32px;border-radius:8px;display:grid;place-items:center;
  border:1px solid color-mix(in srgb, var(--cc) 62%, transparent);
  color:var(--cc);background:color-mix(in srgb, var(--cc) 8%, transparent);
  font-family:var(--cxmono);font-weight:800;font-size:9px;letter-spacing:.06em;
}
.cx-ct{min-width:0}
.cx-ct strong{
  display:block;font-family:var(--cxdisp);font-weight:600;font-size:13px;color:var(--cxtext);
  text-transform:uppercase;letter-spacing:.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cx-state{
  margin-top:2px;color:var(--cc);display:flex;align-items:center;gap:5px;
  font-family:var(--cxmono);font-size:8px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
}
.cx-state::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cc);box-shadow:0 0 9px var(--cc)}
.cx-dot{width:9px;height:9px;border-radius:50%;background:var(--cc);box-shadow:0 0 10px var(--cc)}
.cx-card[data-sev="crit"] .cx-dot{animation:cxPulseDot 1.4s infinite}
.cx-sum{margin:6px 0 5px;min-height:25px;color:#b4c6d7;font-size:10.5px;line-height:1.32;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cx-mets{border-top:1px solid rgba(112,179,221,.15);padding-top:4px;display:grid;grid-template-columns:1fr 1fr}
.cx-met{min-width:0;padding:3px 8px 3px 0}
.cx-met:nth-child(even){border-left:1px solid rgba(112,179,221,.15);padding-left:10px;padding-right:0}
.cx-met:nth-child(n+3){border-top:1px solid rgba(112,179,221,.11);padding-top:3px}
.cx-met span{
  display:block;color:var(--cxdim);font-family:var(--cxmono);
  font-size:7px;line-height:1.1;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cx-met b{
  display:block;margin-top:2px;font-family:var(--cxdisp);font-weight:600;color:var(--cxtext);
  font-size:13.5px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cx-met b.cx-bad{color:var(--cxred)}
.cx-meta{
  margin-top:4px;color:var(--cxdim);font-size:8.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cx-acts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(112,179,221,.15)}
.cx-acts a,.cx-acts button{
  appearance:none;border:0;border-right:1px solid rgba(112,179,221,.15);
  background:rgba(255,255,255,.01);color:#8da2b5;min-height:26px;
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  font-family:var(--cxmono);font-size:8.5px;font-weight:700;letter-spacing:.08em;
  transition:.2s ease;text-decoration:none;cursor:pointer;
}
.cx-acts a:last-child,.cx-acts button:last-child{border-right:0}
.cx-acts a:hover,.cx-acts button:hover{color:var(--cxtext);background:color-mix(in srgb, var(--cc) 10%, transparent)}
.cx-acts svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* posiciones (por id de Chief) */
.cx-card[data-cid="dst"]{left:17%;top:4%}
.cx-card[data-cid="leg"]{left:50%;top:1%;transform:translateX(-50%)}
.cx-card[data-cid="leg"]:hover,.cx-card[data-cid="leg"]:focus-within,.cx-card[data-cid="leg"].cx-on{transform:translateX(-50%) translateY(-5px) scale(1.014)}
.cx-card[data-cid="fin"]{right:16%;top:4.5%}
.cx-card[data-cid="rrhh"]{left:2.5%;top:35%}
.cx-card[data-cid="mkt"]{right:2.5%;top:35%}
.cx-card[data-cid="vta"]{left:14.5%;bottom:2%}
.cx-card[data-cid="prd"]{left:50%;bottom:1%;transform:translateX(-50%)}
.cx-card[data-cid="prd"]:hover,.cx-card[data-cid="prd"]:focus-within,.cx-card[data-cid="prd"].cx-on{transform:translateX(-50%) translateY(-5px) scale(1.014)}
.cx-card[data-cid="rev"]{right:13.5%;bottom:2%}

/* paneles de sistema */
.cx-sys{
  position:absolute;width:200px;bottom:11px;padding:11px 13px;z-index:2;
  border:1px solid rgba(84,184,255,.14);border-radius:13px;
  background:rgba(4,17,30,.66);
}
.cx-sys.cx-l{left:11px}
.cx-sys.cx-r{right:11px}
.cx-pt{color:var(--cxdim);font-family:var(--cxmono);font-size:8px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.cx-wave{height:28px;margin:6px 0 4px;position:relative;overflow:hidden}
.cx-wave svg{position:absolute;left:0;top:0;width:200%;height:100%;animation:cxWave 7s linear infinite}
.cx-wave path{fill:none;stroke:var(--cxcyan);stroke-width:1.3;opacity:.75}
.cx-wave.cx-ekg path{stroke:var(--cxgreen)}
.cx-ss{display:flex;justify-content:space-between;gap:8px;color:var(--cxmuted);font-size:10px}
.cx-ss span:first-child{display:flex;align-items:center;gap:6px}
.cx-ss #cxClock{font-family:var(--cxmono);font-size:9.5px}
.cx-mini{width:7px;height:7px;border-radius:50%;background:var(--cxgreen);box-shadow:0 0 9px var(--cxgreen);flex:0 0 auto}
.cx-cap{
  position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:2;
  color:var(--cxdim);font-family:var(--cxmono);font-size:8px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;
}

/* tweaks */
.cx-gear{
  position:absolute;top:11px;right:11px;z-index:20;width:32px;height:32px;
  border-radius:9px;border:1px solid rgba(85,190,255,.22);background:rgba(8,24,40,.66);
  color:var(--cxmuted);display:grid;place-items:center;font-size:14px;transition:.2s ease;
}
.cx-gear:hover,.cx-gear[aria-expanded="true"]{border-color:rgba(79,214,255,.6);color:var(--cxcyan)}
.cx-tweaks{
  position:absolute;top:50px;right:11px;width:212px;z-index:21;
  border:1px solid rgba(84,184,255,.24);border-radius:13px;
  background:rgba(9,28,48,.97);box-shadow:0 22px 60px rgba(0,0,0,.4);
  padding:12px 13px;display:none;
}
.cx-tweaks.cx-open{display:block}
.cx-tweaks h4{margin:0 0 3px;font-family:var(--cxmono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--cxdim);font-weight:800}
.cx-tweaks h4 + h4{margin-top:11px}
.cx-tw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-size:12px;color:var(--cxmuted)}
.cx-sw{
  position:relative;width:34px;height:19px;flex:0 0 auto;border-radius:19px;
  border:1px solid rgba(84,184,255,.3);background:rgba(8,24,40,.8);transition:.2s ease;cursor:pointer;
}
.cx-sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--cxmuted);transition:.2s ease}
.cx-sw[aria-checked="true"]{background:rgba(47,141,255,.5);border-color:rgba(79,214,255,.6)}
.cx-sw[aria-checked="true"]::after{left:17px;background:var(--cxcyan);box-shadow:0 0 10px var(--cxcyan)}

/* guía bajo el tablero */
.cx-guide{margin-top:10px;color:var(--dim);font-size:12px;line-height:1.55}
.cx-guide b{color:var(--ink)}

/* animaciones (namespaced) */
@keyframes cxPulseDot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.72);opacity:.55}}
@keyframes cxFlow{from{stroke-dashoffset:0}to{stroke-dashoffset:-76}}
@keyframes cxBlink{0%,100%{opacity:.4}50%{opacity:.95}}
@keyframes cxBreathe{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
@keyframes cxWave{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes cxFloat{0%,100%{transform:translateY(0) rotate(var(--cxrot,0deg))}50%{transform:translateY(-7px) rotate(var(--cxrot,0deg))}}

/* responsive: bajo 1280 el tablero se apila en grilla */
@media (max-width:1280px){
  .cx-dash{height:auto !important;aspect-ratio:auto;min-height:0;padding:18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .cx-stage{position:relative;left:auto;top:auto;transform:none;width:min(560px,100%);grid-column:1 / -1;justify-self:center;margin:8px auto 0}
  .cx-core{position:relative;left:auto;top:auto;transform:none;grid-column:1 / -1;justify-self:center;margin:-72px auto 6px}
  .cx-conn,.cx-sys,.cx-decor,.cx-cap{display:none}
  .cx-card{position:relative;inset:auto !important;width:100%;transform:none !important}
  .cx-card[data-cid="leg"],.cx-card[data-cid="prd"]{transform:none !important}
}
@media (max-width:760px){
  .cx-dash{grid-template-columns:1fr;padding:12px}
  .cx-core{width:170px}
}

/* ══════════════════════════════════════════════════════════════════
   SHELL PANTALLA COMPLETA — todo el app en estilo cerebro.
   Esta capa va al final del CSS, así que gana la cascada.
   ══════════════════════════════════════════════════════════════════ */
html,body{
  background:
    radial-gradient(circle at 50% 34%, rgba(28,108,190,.16), transparent 32%),
    radial-gradient(circle at 14% 78%, rgba(0,170,255,.07), transparent 26%),
    radial-gradient(circle at 88% 60%, rgba(0,255,210,.06), transparent 22%),
    linear-gradient(180deg,#01070f 0%, #020a15 46%, #01060e 100%);
  background-attachment:fixed;
}
.bgrid,.bvig{position:fixed;inset:0;pointer-events:none;z-index:0}
.bgrid{
  opacity:.15;
  background-image:
    linear-gradient(rgba(84,184,255,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(84,184,255,.05) 1px, transparent 1px);
  background-size:44px 44px;
  mask-image:linear-gradient(to bottom, black, transparent 90%);
}
.bvig{background:radial-gradient(ellipse at 50% 42%, transparent 55%, rgba(0,3,8,.5) 100%)}
.shell{position:relative;z-index:1}
::selection{background:rgba(79,214,255,.28)}
::-webkit-scrollbar-thumb{background:rgba(96,190,255,.22);border-radius:6px}
a{color:var(--cyan)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}

/* ── DOCK lateral colapsable ─────────── */
aside{
  width:236px;flex:0 0 236px;
  border-right:1px solid rgba(96,190,255,.14);
  background:rgba(2,9,19,.72);backdrop-filter:blur(16px);
  padding:16px 0 18px;gap:18px;
}
.brand b,.brand span,.grplbl,.foot,.nav .cnt{transition:opacity .18s ease}
.shell.rail aside{width:62px;flex:0 0 62px}
.dockarrow{
  align-self:flex-end;margin:0 12px -6px 0;
  width:26px;height:26px;border-radius:8px;flex:0 0 auto;
  border:1px solid rgba(85,190,255,.28);background:rgba(8,24,40,.7);
  color:var(--mid);font-size:14px;line-height:1;display:grid;place-items:center;
  transition:.2s ease;
}
.dockarrow:hover{border-color:rgba(79,214,255,.6);color:var(--cyan)}
.shell.rail .dockarrow{align-self:center;margin:0 0 -6px 0}
.brand{border-bottom:1px solid rgba(96,190,255,.14);padding:0 16px 16px;gap:11px}
.shell.rail .brand{justify-content:center;padding:0 0 16px}
.brand i{
  width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:transparent;
  border:1px solid rgba(79,214,255,.45);position:relative;
  box-shadow:inset 0 0 18px rgba(79,214,255,.14), 0 0 14px rgba(79,214,255,.1);
}
.brand i::before{content:"";position:absolute;inset:5px;border:1px solid rgba(79,214,255,.32);border-radius:50%}
.brand i::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.brand b{font-family:var(--disp);font-weight:600;letter-spacing:.01em}
.brand span{font-family:var(--mono);color:var(--dim);letter-spacing:.22em}
.shell.rail .brand b,.shell.rail .brand span{display:none}
.grplbl{font-family:var(--mono);color:var(--dim);letter-spacing:.24em;padding:0 16px 9px}
.shell.rail .grplbl{padding:0;text-align:center;font-size:8px;letter-spacing:.1em}
.nav{padding:10px 16px;border-left:2px solid transparent;font-size:13.5px;border-radius:0 10px 10px 0;margin-right:8px}
.nav:hover{background:rgba(79,214,255,.07)}
.nav.on{background:linear-gradient(90deg, rgba(47,141,255,.22), rgba(47,141,255,.04));border-left-color:var(--cyan)}
.nav em{font-family:var(--mono);font-size:10px;color:var(--dim)}
.nav.on em{color:var(--cyan)}
.shell.rail .nav{font-size:0;justify-content:center;padding:11px 0;margin-right:0;border-radius:0}
.shell.rail .nav em{font-size:11px}
.shell.rail .nav .cnt{display:none}
.chiefitem{border-top:1px solid rgba(96,190,255,.09);padding:9px 16px;font-size:13px}
.chiefitem:hover{background:rgba(79,214,255,.06)}
.chiefitem i{border-radius:50%;box-shadow:0 0 9px currentColor}
.shell.rail .chiefitem{justify-content:center;padding:10px 0}
.shell.rail .chiefitem span{display:none}
.foot{border-top:1px solid rgba(96,190,255,.14);padding:14px 16px 0}
.foot .l{font-family:var(--mono);color:var(--dim);letter-spacing:.2em}
.foot .b{font-family:var(--disp);font-weight:600}
.shell.rail .foot{display:none}

/* ── HEADER estilo torre ─────────────── */
header{
  position:sticky;top:0;z-index:60;align-items:center;
  padding:12px 26px;border-bottom:1px solid rgba(96,190,255,.14);
  background:rgba(1,7,15,.74);backdrop-filter:blur(18px);
}
.hbrand{
  width:44px;height:44px;flex:0 0 44px;position:relative;margin-right:14px;
  border:1px solid rgba(79,214,255,.45);border-radius:50%;
  display:grid;place-items:center;
  box-shadow:inset 0 0 22px rgba(79,214,255,.13), 0 0 18px rgba(79,214,255,.1);
}
.hbrand::before{content:"";position:absolute;inset:7px;border:1px solid rgba(79,214,255,.32);border-radius:50%}
.hbrand::after{content:"";position:absolute;inset:13px;border:1px dashed rgba(79,214,255,.32);border-radius:50%;animation:spinh 14s linear infinite}
.hbrand span{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px var(--cyan)}
@keyframes spinh{to{transform:rotate(360deg)}}
header>div:nth-child(2){margin-right:auto}
header .sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.3em;color:var(--dim)}
header h1{font-family:var(--disp);font-weight:600;font-size:clamp(20px,1.8vw,27px);letter-spacing:-.03em;color:var(--ink)}
.seg{border:1px solid rgba(83,180,245,.22);border-radius:12px;overflow:hidden;background:rgba(4,16,29,.66)}
.seg button{border-right:1px solid rgba(83,180,245,.14);padding:9px 17px;font-family:var(--disp);font-weight:600;font-size:13px;color:var(--mid)}
.seg button:not(.on):hover{background:rgba(79,214,255,.07);color:var(--ink)}
.seg button.on{
  background:linear-gradient(180deg, rgba(47,141,255,.30), rgba(47,141,255,.08));color:#fff;
  box-shadow:inset 0 0 0 1px rgba(79,214,255,.6), 0 0 22px rgba(47,141,255,.22);
}
.tgl{
  border:1px solid rgba(85,190,255,.22);border-radius:10px;background:rgba(8,24,40,.66);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;padding:9px 13px;color:var(--mid);
  transition:.2s ease;
}
.tgl:hover{border-color:rgba(79,214,255,.6);color:var(--ink);background:rgba(8,24,40,.66)}
.cta{
  border:1px solid rgba(255,104,64,.6);border-radius:10px;
  background:linear-gradient(135deg,#ff3d27,#f2822f);
  box-shadow:0 8px 26px rgba(255,68,35,.22);
  font-family:var(--disp);font-weight:600;font-size:13px;padding:9px 17px;
  transition:.2s ease;
}
.cta:hover{background:linear-gradient(135deg,#ff3d27,#f2822f);border-color:rgba(255,124,84,.8);transform:translateY(-1px);box-shadow:0 12px 32px rgba(255,68,35,.3)}
.conx{border-radius:10px;font-family:var(--mono)}
.legend{
  border:1px solid rgba(84,184,255,.15);border-radius:11px;
  background:rgba(6,21,36,.55);padding:8px 13px;font-size:12px;
}
.legend i{border-radius:50%;box-shadow:0 0 10px currentColor}

section.view{padding:20px 26px 44px}
.lede{color:var(--mid)}
.lede strong{color:var(--ink)}

/* ── escenario radar/sala + muro ─────── */
.stage{
  border:1px solid rgba(83,180,245,.16);border-radius:22px;
  background:
    radial-gradient(circle at 50% 55%, rgba(22,116,208,.13), transparent 36%),
    linear-gradient(180deg, rgba(2,12,23,.9), rgba(2,8,17,.8));
  box-shadow:var(--sh2), inset 0 0 0 1px rgba(255,255,255,.02);
}
.wall .tile,.tile{
  border:1px solid rgba(91,170,219,.30);border-radius:15px;
  background:linear-gradient(180deg, rgba(6,24,41,.93), rgba(4,17,29,.91));
  box-shadow:0 15px 45px rgba(0,0,0,.24);position:relative;overflow:hidden;
  transition:transform .24s ease, border-color .24s ease, box-shadow .24s ease;
}
.tile:hover{
  transform:translateY(-4px);
  border-color:rgba(79,214,255,.55);
  box-shadow:0 0 0 1px rgba(79,214,255,.2), 0 14px 40px rgba(0,0,0,.3), 0 0 32px rgba(79,214,255,.14);
}
.tile::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg, var(--cyan), transparent 80%);opacity:.45}
.tile h3{font-family:var(--disp);font-weight:600;letter-spacing:.02em}
.tile .st{font-family:var(--mono);font-size:9px;letter-spacing:.14em}
.tile .big{
  display:grid;grid-template-columns:1fr 1fr;gap:0;
  border-top:1px solid rgba(112,179,221,.15);padding-top:6px;
}
.tile .big>div{min-width:0;padding:5px 8px 6px 0}
.tile .big>div:nth-child(even){border-left:1px solid rgba(112,179,221,.15);padding-left:10px;padding-right:0}
.tile .big>div:nth-child(n+3){border-top:1px solid rgba(112,179,221,.11);padding-top:6px}
.tile .big s{
  display:block;text-decoration:none;color:var(--dim);font-family:var(--mono);
  font-size:7.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tile .big b{
  display:block;margin-top:3px;font-family:var(--disp);font-weight:600;
  font-size:15px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tile .meta{color:var(--dim);font-size:9.5px}
.tile .acts2 button,.tile .acts2 a{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em}
.tickbar{border:1px solid rgba(96,190,255,.14);border-radius:12px;background:rgba(4,17,30,.6);color:var(--mid)}
.mark{border-radius:10px !important;background-image:none !important;background:rgba(79,214,255,.07);font-family:var(--mono)}

/* pods del radar/sala */
.pod .box,.hub .box,.podcard,.card{border-radius:14px}
.hub .box{
  border:1px solid rgba(79,214,255,.6) !important;border-radius:16px;
  background:linear-gradient(180deg, rgba(8,28,48,.97), rgba(4,18,33,.96)) !important;
  box-shadow:0 0 0 5px rgba(79,214,255,.05), 0 0 40px rgba(47,141,255,.24), var(--sh2);
}

/* ── formularios, botones, tablas ────── */
input,select,textarea{
  background:#0a1c30;border:1px solid rgba(96,190,255,.25);color:var(--ink);
  border-radius:9px;
}
input:focus,select:focus,textarea:focus{border-color:rgba(79,214,255,.6)}
.btn{border-radius:10px;font-family:var(--mono);letter-spacing:.05em}
.btn.ghost{background:rgba(8,24,40,.66);color:var(--mid)}
.btn.ghost:hover{border-color:rgba(79,214,255,.6);color:var(--ink)}
table{border-color:rgba(96,190,255,.16)}
th{font-family:var(--mono);letter-spacing:.08em;color:var(--dim)}
.toast{border-radius:12px;border:1px solid rgba(79,214,255,.26);background:rgba(4,17,30,.95);color:#ddecf8}
.toast.mal{border-color:rgba(255,80,99,.5)}

/* ── botón resumen del núcleo ────────── */
.cx-imopen{
  margin-top:0;width:100%;min-height:26px;border-radius:8px;padding:5px 4px;
  border:1px solid rgba(79,214,255,.45);
  background:linear-gradient(180deg, rgba(47,141,255,.26), rgba(47,141,255,.06));
  color:var(--cyan);font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.05em;
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  line-height:1.15;text-align:center;white-space:normal;
  transition:.2s ease;cursor:pointer;
}
.cx-imopen:hover{border-color:rgba(79,214,255,.8);box-shadow:0 0 18px rgba(79,214,255,.25);color:#fff}
.cx-imopen i{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:cxPulseDot 1.8s infinite}

/* ── ICE MIND overlay ────────────────── */
.im{position:fixed;inset:0;display:none;place-items:center;z-index:130;padding:22px;
  background:rgba(0,5,12,.82);backdrop-filter:blur(18px)}
.im.open{display:grid}
.im-card{
  position:relative;width:min(720px,96vw);text-align:center;
  padding:30px 28px 24px;border-radius:26px;
  border:1px solid rgba(84,184,255,.26);
  background:linear-gradient(180deg, rgba(6,20,37,.97), rgba(3,12,24,.98));
  box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 60px rgba(47,141,255,.12);
  animation:rise .22s ease;
}
.im-x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:10px;
  border:1px solid rgba(84,184,255,.2);color:var(--mid)}
.im-x:hover{border-color:rgba(79,214,255,.55);color:var(--ink)}
.im-eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
.im-card h3{margin:6px 0 0;font-family:var(--disp);font-weight:600;font-size:27px;letter-spacing:-.02em;color:var(--ink)}
#imOrb{width:280px;height:280px;margin:2px auto 0;display:block}
.im-transcript{
  max-height:170px;overflow:auto;text-align:left;
  margin:6px auto 16px;padding:13px 16px;
  border:1px solid rgba(96,190,255,.16);border-radius:14px;
  background:rgba(8,24,40,.5);
  color:var(--body);font-size:13px;line-height:1.7;
}
.im-ctl{display:flex;justify-content:center;gap:10px}
.im-ctl .btn{min-width:130px}
@media (max-width:760px){
  #imOrb{width:210px;height:210px}
  .im-card{padding:22px 16px 18px}
}


/* ── núcleo enriquecido ──────────────── */
.cx-breakdown{display:flex;gap:5px;margin-top:6px}
.cx-bd{
  --bc:var(--cyan);
  min-width:19px;height:17px;padding:0 5px;border-radius:5px;
  display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:9.5px;font-weight:800;color:var(--bc);
  background:color-mix(in srgb, var(--bc) 14%, transparent);
  border:1px solid color-mix(in srgb, var(--bc) 40%, transparent);
}
.cx-coreacts{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}
.cx-imopen-alt{
  background:rgba(8,24,40,.6);border-color:rgba(96,190,255,.28);color:var(--mid);
}
.cx-imopen-alt:hover{color:var(--ink);border-color:rgba(79,214,255,.6);box-shadow:none}
.cx-imopen-alt i{display:none}

/* ── Ice Mind: transcripción progresiva + chips KPI ──── */
.im-line{opacity:0;transform:translateY(6px);transition:opacity .35s ease, transform .35s ease;padding:3px 0}
.im-line.im-in{opacity:1;transform:none}
.im-kpis{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 auto 14px;max-width:560px}
.im-chip{
  opacity:0;transform:translateY(8px) scale(.94);
  transition:opacity .3s ease, transform .3s ease;
  --cc:var(--cyan);

const META=Sem.META, BAND=Sem.BAND, ANG=Sem.ANG, POS=Sem.POS, WIRE=Sem.WIRE;
const CR=Sem.CR, AL=Sem.AL, OK=Sem.OK, DEEP=Sem.DEEP;

const Base = (function(){
/* ══════════════════════════════════════════════════════════════════
   base.js — la capa de datos.

   Regla de oro: la torre nunca queda en blanco. Si Firestore no está
   configurado, no responde, o la base está vacía, se muestran los datos
   semilla con un aviso arriba. Todo lo demás sigue funcionando igual.

   Estructura en Firestore
   ───────────────────────
   chiefs/{id}                        estado actual de cada Chief (lo que lee la torre)
   chiefs/{id}/updates/{fecha}        histórico: lo que dejó el agente ese día
   chiefs/{id}/responses/{fecha}      tus respuestas a las preguntas del Chief
   agentes/{id}                       la flota
   dias/{fecha}                       bitácora, KPIs del día y de la semana
   reuniones/{semana}                 agenda, decisiones, tareas y acta
   ══════════════════════════════════════════════════════════════════ */


const SDK = 'https://www.gstatic.com/firebasejs/10.12.2';

/* Estado de la conexión, para el indicador de la cabecera.
   'demo'        → sin configurar, o falló la conexión
   'vacia'       → conectado, pero la base no tiene nada
   'viva'        → leyendo de Firestore en tiempo real  */
const conexion = { estado: 'demo', detalle: 'Datos de ejemplo', error: null };

let db = null, fb = null;
const oyentes = new Set();

/* Lo que la torre lee. Arranca con las semillas y se reemplaza
   cuando Firestore responde. */
const datos = {
  chiefs: JSON.parse(JSON.stringify(Sem.CHIEFS)),
  agentes: JSON.parse(JSON.stringify(Sem.SEED)),
  dia: { log: Sem.DAY_LOG, must: Sem.DAY_MUST, kpisHoy: Sem.KPIS_HOY, kpisSemana: Sem.KPIS_SEMANA },
  reunion: { agenda: Sem.AGENDA, decisiones: Sem.DECISIONS, tareas: Sem.TASKS, acta: Sem.ACTA },
  respuestas: {},
  solicitudes: []
};

function alCambiar(fn) { oyentes.add(fn); return () => oyentes.delete(fn); }
function avisar() { oyentes.forEach(fn => { try { fn(); } catch (e) { console.error(e); } }); }

const hoy = () => new Date().toISOString().slice(0, 10);
function semanaActual() {
  const d = new Date(); const jueves = new Date(d);
  jueves.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
  const primero = new Date(jueves.getFullYear(), 0, 4);
  const n = 1 + Math.round(((jueves - primero) / 86400000 - 3 + ((primero.getDay() + 6) % 7)) / 7);
  return jueves.getFullYear() + '-S' + String(n).padStart(2, '0');
}

/* ── Arranque ─────────────────────────────────────────────────── */
async function iniciar() {
  const config = window.FIREBASE_CONFIG;
  if (!config || !config.projectId || String(config.projectId).startsWith('TU_')) {
    return caer('Firebase sin configurar');
  }
  if (location.protocol === 'file:') {
    return caer('Abierto como archivo local — súbelo a Netlify o sírvelo para conectar');
  }

  try {
    const [appMod, authMod, dbMod] = await Promise.all([
      import(`${SDK}/firebase-app.js`),
      import(`${SDK}/firebase-auth.js`),
      import(`${SDK}/firebase-firestore.js`)
    ]);
    fb = dbMod;
    const app = appMod.initializeApp(config);

    /* Sesión anónima: no hay pantalla de login, pero las reglas de
       Firestore sí pueden exigir que exista una sesión. */
    const auth = authMod.getAuth(app);
    try { await authMod.signInAnonymously(auth); }
    catch (e) {
      if (e && String(e.code).includes('operation-not-allowed')) {
        console.warn('Habilita "Anónimo" en Firebase → Authentication → Sign-in method.');
      } else { throw e; }
    }

    db = dbMod.getFirestore(app);
    await escuchar();
  } catch (e) {
    return caer('No se pudo conectar con Firestore', e);
  }
}

function caer(detalle, error) {
  conexion.estado = 'demo';
  conexion.detalle = detalle;
  conexion.error = error ? (error.message || String(error)) : null;
  if (error) console.warn('[Torre]', detalle, error);
  avisar();
}

/* ── Escuchar en vivo ─────────────────────────────────────────── */
async function escuchar() {
  const { collection, doc, onSnapshot, getDocs } = fb;

  const primeros = await getDocs(collection(db, 'chiefs'));
  if (primeros.empty) {
    conexion.estado = 'vacia';
    conexion.detalle = 'Base conectada pero vacía';
    avisar();
  } else {
    conexion.estado = 'viva';
    conexion.detalle = 'En vivo desde Firestore';
  }

  onSnapshot(collection(db, 'chiefs'), snap => {
    if (snap.empty) return;
    /* El orden de los Chiefs lo manda el archivo de datos, no Firestore:
       así la posición en el radar no cambia sola. */
    const porId = {};
    snap.forEach(d => { porId[d.id] = { ...d.data(), id: d.id }; });
    /* La identidad del Chief la manda el archivo, no el agente. Si un agente
       escribe area, code o id por error, no puede desarmar la torre. */
    datos.chiefs = Sem.CHIEFS.map(base => porId[base.id]
      ? { ...base, ...porId[base.id], id: base.id, area: base.area, code: base.code }
      : base);
    conexion.estado = 'viva';
    conexion.detalle = 'En vivo desde Firestore';
    avisar();
  }, e => caer('Se perdió la conexión con los Chiefs', e));

  onSnapshot(collection(db, 'agentes'), snap => {
    if (snap.empty) return;
    const lista = [];
    snap.forEach(d => lista.push({ id: d.id, ...d.data() }));
    lista.sort((a, b) => (a.orden ?? 0) - (b.orden ?? 0));
    datos.agentes = lista;
    avisar();
  }, e => caer('Se perdió la conexión con los agentes', e));

  onSnapshot(doc(db, 'dias', hoy()), d => {
    if (d.exists()) { datos.dia = { ...datos.dia, ...d.data() }; avisar(); }
  }, e => console.warn('[Torre] día:', e));

  onSnapshot(doc(db, 'reuniones', semanaActual()), d => {
    if (d.exists()) { datos.reunion = { ...datos.reunion, ...d.data() }; avisar(); }
  }, e => console.warn('[Torre] reunión:', e));

  onSnapshot(collection(db, 'meetingRequests'), snap => {
    const lista = [];
    snap.forEach(d => lista.push({ id: d.id, ...d.data() }));
    lista.sort((a, b) => String(b.creado||'').localeCompare(String(a.creado||'')));
    datos.solicitudes = lista;
    avisar();
  }, e => console.warn('[Torre] conversaciones entre Chiefs:', e));
}

/* ── Escrituras ───────────────────────────────────────────────── */
const conectado = () => !!db;

async function guardarAgente(agente, orden) {
  if (!db) { local(agente); return { ok: true, local: true }; }
  try {
    const { doc, setDoc } = fb;
    await setDoc(doc(db, 'agentes', agente.id), { ...agente, orden: orden ?? 0 }, { merge: true });
    return { ok: true };
  } catch (e) { return { ok: false, error: e.message }; }
}

async function borrarAgente(id) {
  if (!db) {
    datos.agentes = datos.agentes.filter(a => a.id !== id);
    datos.agentes.forEach(a => { if (a.dependsOn === id) a.dependsOn = ''; });
    avisar(); return { ok: true, local: true };
  }
  try {
    const { doc, deleteDoc, setDoc } = fb;
    await deleteDoc(doc(db, 'agentes', id));
    for (const a of datos.agentes) {
      if (a.dependsOn === id) await setDoc(doc(db, 'agentes', a.id), { dependsOn: '' }, { merge: true });
    }
    return { ok: true };
  } catch (e) { return { ok: false, error: e.message }; }
}

function local(agente) {
  const i = datos.agentes.findIndex(a => a.id === agente.id);
  if (i >= 0) datos.agentes[i] = agente; else datos.agentes.push(agente);
  avisar();
}

async function guardarEstructura(chiefId, estructura, extra) {
  const c = datos.chiefs.find(x => x.id === chiefId);
  if (c) { c.estructura = estructura; Object.assign(c, extra || {}); }
  if (!db) { avisar(); return { ok: true, local: true }; }
  try {
    const { doc, setDoc } = fb;
    await setDoc(doc(db, 'chiefs', chiefId), { estructura, ...(extra || {}) }, { merge: true });
    return { ok: true };
  } catch (e) { return { ok: false, error: e.message }; }
}

async function guardarCampos(chiefId, campos) {
  const c = datos.chiefs.find(x => x.id === chiefId);
  if (c) Object.assign(c, campos);
  if (!db) { avisar(); return { ok: true, local: true }; }
  try {
    const { doc, setDoc } = fb;
    await setDoc(doc(db, 'chiefs', chiefId), campos, { merge: true });
    return { ok: true };
  } catch (e) { return { ok: false, error: e.message }; }
}

async function guardarRespuestas(chiefId, respuestas) {
  datos.respuestas[chiefId] = respuestas;
  if (!db) return { ok: true, local: true };
  try {
    const { doc, setDoc } = fb;
    await setDoc(doc(db, 'chiefs', chiefId, 'responses', hoy()),
      { respuestas, fecha: hoy(), guardado: new Date().toISOString() }, { merge: true });
    return { ok: true };
  } catch (e) { return { ok: false, error: e.message }; }
}

/* ── Conversaciones entre Chiefs (Sala de reuniones) ─────────────
   Guarda la solicitud (y el diálogo armado en el momento) en
   meetingRequests/{id}. Si más adelante un agente de Cowork quiere
   enriquecerla con una síntesis propia, escribe en el mismo
   documento con estado:'lista' y un resultado más completo — la
   torre lo muestra igual, no hay que tocar el HTML. */
async function crearReunion(payload) {
  const item = { ...payload, creado: new Date().toISOString() };
  if (!db) {
    item.id = 'local-' + Date.now();
    datos.solicitudes.unshift(item);
    avisar();
    return { ok: true, local: true, id: item.id };
  }
  try {
    const { collection, doc, setDoc } = fb;
    const ref = doc(collection(db, 'meetingRequests'));
    await setDoc(ref, item);
    return { ok: true, id: ref.id };
  } catch (e) {
    /* Sin permiso todavía en firestore.rules para esta colección nueva:
       igual dejamos la conversación a la vista (solo en esta sesión)
       para que lo generado no se pierda mientras se habilita el acceso. */
    item.id = 'local-' + Date.now();
    item.local = true;
    datos.solicitudes.unshift(item);
    avisar();
    return { ok: false, local: true, error: e.message };
  }
}

/* ── Siembra inicial ──────────────────────────────────────────── */
async function sembrar() {
  if (!db) return { ok: false, error: 'Sin conexión con Firestore' };
  try {
    const { doc, setDoc, writeBatch } = fb;
    const lote = writeBatch(db);

    Sem.CHIEFS.forEach(c => lote.set(doc(db, 'chiefs', c.id), {
      ...c,
      /* La estructura se siembra deducida de los datos de ejemplo, así el
         editor arranca con algo y no con una pantalla vacía. */
      estructura: c.estructura || {
        kpis: (c.kpis || []).map(k => ({ label: k.label, note: k.note || '' })),
        metricas: (c.metrics || []).map(m => ({ label: m.label }))
      },
      sembrado: new Date().toISOString()
    }));
    Sem.SEED.forEach((a, i) => lote.set(doc(db, 'agentes', a.id), { ...a, orden: i }));
    lote.set(doc(db, 'dias', hoy()),
      { log: Sem.DAY_LOG, must: Sem.DAY_MUST, kpisHoy: Sem.KPIS_HOY, kpisSemana: Sem.KPIS_SEMANA, fecha: hoy() });
    lote.set(doc(db, 'reuniones', semanaActual()),
      { agenda: Sem.AGENDA, decisiones: Sem.DECISIONS, tareas: Sem.TASKS, acta: Sem.ACTA, semana: semanaActual() });

    await lote.commit();
    conexion.estado = 'viva';
    conexion.detalle = 'En vivo desde Firestore';
    avisar();
    return { ok: true, escritos: Sem.CHIEFS.length + Sem.SEED.length + 2 };
  } catch (e) { return { ok: false, error: e.message }; }
}

return {conexion,datos,alCambiar,iniciar,conectado,guardarAgente,borrarAgente,guardarEstructura,guardarCampos,guardarRespuestas,crearReunion,sembrar,hoy,semanaActual};
})();

/* Si por lo que sea el escenario queda sin altura, no dejamos la vista en blanco:
   se cae a la grilla, que muestra exactamente el mismo contenido. */
/* En vez de adivinar umbrales de pantalla, medimos lo que realmente pasó:
   si las tarjetas se pisan, se salen del marco, tapan el centro o el escenario
   quedó sin altura, la vista se cae a la grilla con el mismo contenido. */
/* El escenario mide el espacio que realmente le queda y se ajusta.
   Así deja de importar cuánto ocupan la cabecera, el texto guía o el
   aviso de conexión: si algo crece, el escenario se encoge solo. */
function acomodarEscenario(){
  const st=document.querySelector('.stage');
  if(!st) return;
  st.classList.remove('plano');
  st.style.height='';
  const arriba=st.getBoundingClientRect().top;
  const seccion=st.closest('section.view');
  const abajo=seccion?(parseFloat(getComputedStyle(seccion).paddingBottom)||0):24;
  const disponible=Math.round(window.innerHeight-arriba-abajo-4);
  st.style.height=Math.max(360,Math.min(disponible,780))+'px';

  /* Con el escenario ya dimensionado, buscamos la disposición que sí entra
     para los estados que haya hoy, y movemos las tarjetas a su lugar.
     Solo si ninguna sirve nos vamos a la grilla. */
  if(st.classList.contains('radar')) reacomodarOrbita(st);

  if(noCabe(st)){ st.classList.add('plano'); st.style.height=''; }
}

function reacomodarOrbita(st){
  const pods=[...st.querySelectorAll('[data-pod]')];
  if(!pods.length) return;
  const S1=st.getBoundingClientRect(), P1=pods[0].getBoundingClientRect();
  const caja=st.querySelector('.hub .box');
  const HB=caja?caja.getBoundingClientRect():{width:150,height:112};
  const med={W:S1.width,H:S1.height,w:P1.width,h:P1.height,hw:HB.width,hh:HB.height};
  if(!med.w||!med.h) return;

  const actual=S.orbita||orbitaPorDefecto();
  if(sirveDisposicion(actual,med)){ S.orbita=actual; return; }

  const nueva=disponerOrbita(med);
  if(!nueva) return;                 /* ninguna entra: decide noCabe() */
  const cambiaModo = actual.modo!==nueva.modo;
  S.orbita=nueva;

  if(cambiaModo){
    /* Cambian también las guías y el texto: hay que redibujar, una sola vez. */
    if(!S.reacomodando){ S.reacomodando=true; render(); S.reacomodando=false; }
    return;
  }
  /* Mismo modo: basta con mover las tarjetas y sus líneas. */
  CHIEFS().forEach(c=>{
    const p=nueva.puntos[c.id]; if(!p) return;
    const pod=st.querySelector('[data-pod="'+c.id+'"]');
    if(pod){ pod.style.left=p.x.toFixed(2)+'%'; pod.style.top=p.y.toFixed(2)+'%'; }
    const ln=st.querySelector('[data-linea="'+c.id+'"]');
    if(ln){ ln.setAttribute('x2',p.x.toFixed(2)); ln.setAttribute('y2',p.y.toFixed(2)); }
  });
}

function noCabe(st){
  const S=st.getBoundingClientRect();
  if(S.height<380) return true;
  const cards=[...st.querySelectorAll('.pod,.seat')].map(e=>e.getBoundingClientRect());
  if(!cards.length) return false;
  for(const b of cards){
    if(b.left<S.left-1||b.right>S.right+1||b.top<S.top-1||b.bottom>S.bottom+1) return true;
  }
  for(let i=0;i<cards.length;i++){
    for(let j=i+1;j<cards.length;j++){
      const a=cards[i],b=cards[j];
      if(a.left<b.right&&b.left<a.right&&a.top<b.bottom&&b.top<a.bottom) return true;
    }
  }
  const centro=st.querySelector('.hub .box')||st.querySelector('.mesa');
  if(centro){
    const C=centro.getBoundingClientRect();
    for(const b of cards){
      if(b.left<C.right&&C.left<b.right&&b.top<C.bottom&&C.top<b.bottom) return true;
    }
  }
  return false;
}

/* ══════════════════════════════════════════════════════════
   ESTRUCTURA FLEXIBLE

   La tarjeta ya no exige campos con nombre fijo. Lee kpis[] y muestra
   lo que venga: los dos primeros van al radar, todos van al detalle.
   Si un Chief todavía no tiene datos, se dibujan las etiquetas que
   definiste en Estructura con un guion, para que se vea la forma.
   ══════════════════════════════════════════════════════════ */

/* Estructura declarada de un Chief: qué KPIs y qué métricas espera.
   Si no hay ninguna declarada, se deduce de lo que ya tiene. */
/* Todo lo que llega de un agente puede venir con cualquier forma.
   Nada de esto debe poder romper el dibujo. */
const lista=v=>Array.isArray(v)?v.filter(x=>x!=null):[];

/* Emparejar etiquetas sin castigar por un espacio o una mayúscula.
   'COSTO / TON', 'costo/ton' y 'Costo / Ton' son la misma cosa. */
const claveEtiqueta=t=>String(t||'').toLowerCase()
  .replace(/\s*\/\s*/g,'/').replace(/\s+/g,' ').trim();

function estructura(c){
  const e=c&&c.estructura;
  if(e&&Array.isArray(e.kpis))
    return {kpis:lista(e.kpis),metricas:lista(e.metricas),bloques:lista(e.bloques)};
  return {
    kpis:lista(c&&c.kpis).map(k=>({label:(k&&k.label)||'',note:(k&&k.note)||''}))
                         .filter(k=>k.label),
    metricas:lista(c&&c.metrics).map(m=>({label:(m&&m.label)||''})).filter(m=>m.label),
    bloques:[]
  };
}

/* La estructura manda la FORMA; el agente manda los VALORES.
   Se recorren los KPIs declarados y a cada uno se le busca su valor
   entre los que llegaron. El que no llegó todavía muestra un guion. */
function kpisDe(c){
  const e=estructura(c);
  const llegaron=lista(c&&c.kpis);
  if(!e.kpis.length) return llegaron;
  const porNombre={};
  llegaron.forEach(k=>{ porNombre[claveEtiqueta(k&&k.label)]=k; });
  return e.kpis.map(k=>{
    const d=porNombre[claveEtiqueta(k&&k.label)];
    return {label:k.label,
            value:d?d.value:'—',
            note:d?(d.note||k.note||''):(k.note||'sin datos aún')};
  });
}
function kpiN(c,i){
  const k=kpisDe(c)[i];
  if(k) return {label:k.label||'',value:k.value||'—'};
  /* Compatibilidad con la forma antigua, por si quedó algo escrito así */
  if(i===0&&c.k1label) return {label:c.k1label,value:c.k1value};
  if(i===1&&c.k2label) return {label:c.k2label,value:c.k2value};
  return {label:'',value:''};
}
function metricasDe(c){
  const e=estructura(c), llegaron=lista(c&&c.metrics);
  if(!e.metricas.length) return llegaron;
  const porNombre={};
  llegaron.forEach(m=>{ porNombre[claveEtiqueta(m&&m.label)]=m; });
  return e.metricas.map(m=>{
    const d=porNombre[claveEtiqueta(m&&m.label)];
    return d?d:{label:m.label,hoy:'—',semana:'—',pct:'0%',delta:'sin datos aún',up:true};
  });
}
const listaDe=(c,campo)=>lista(c&&c[campo]);


/* ══════════════════════════════════════════════════════════
   BLOQUES LIBRES

   Además de los KPIs, el agente puede mandar bloques con la forma que
   quiera. La torre dibuja lo que llegue y no se rompe con lo que no
   conoce: un tipo desconocido se muestra como texto.

     {tipo:'texto',  titulo:'Lectura', contenido:'...'}
     {tipo:'lista',  titulo:'Hallazgos', items:['...','...']}
     {tipo:'datos',  titulo:'Números', items:[{label,value,note}]}
     {tipo:'tabla',  titulo:'Por cliente', columnas:[...], filas:[[...]]}
     {tipo:'alerta', titulo:'Ojo', contenido:'...'}
   ══════════════════════════════════════════════════════════ */
function bloquesDe(c){
  const propios=lista(c&&c.bloques).filter(b=>typeof b==='object');
  if(propios.length) return propios;
  const e=estructura(c);
  if(Array.isArray(e.bloques)&&e.bloques.length)
    return e.bloques.map(b=>({tipo:b.tipo||'texto',titulo:b.titulo||'',
      contenido:'Todavía no llega este bloque del agente.',items:[],vacio:true}));
  return [];
}

function pintarBloque(b){
  const t=(b.tipo||'texto').toLowerCase();
  const titulo=b.titulo?esc(b.titulo).toUpperCase():'';
  const cuerpo=(()=>{
    if(t==='lista') return lista(b.items).map(x=>
      '<div class="row"><div class="txt">'+esc(typeof x==='string'?x:JSON.stringify(x))+'</div></div>').join('')
      || '<div class="row"><div class="txt" style="color:var(--mid)">Sin elementos.</div></div>';
    if(t==='datos') return '<div class="kpis" style="border:0">'+lista(b.items).map(k=>
      '<div class="kpi"><span>'+esc((k&&k.label)||'')+'</span>'
      +'<b>'+esc(k&&k.value!=null?k.value:'—')+'</b>'
      +'<em>'+esc((k&&k.note)||'')+'</em></div>').join('')+'</div>';
    if(t==='tabla'){
      const cols=lista(b.columnas), filas=lista(b.filas);
      if(!cols.length&&!filas.length) return '<div class="row"><div class="txt" style="color:var(--mid)">Tabla vacía.</div></div>';
      /* Firestore no admite listas dentro de listas, así que las filas llegan
         como {celdas:[...]}. Aceptamos las dos formas. */
      const celdasDe=f=>Array.isArray(f)?f:(f&&Array.isArray(f.celdas)?f.celdas:[String(f)]);
      return '<div style="overflow-x:auto"><table class="tbl"><thead><tr>'
        +cols.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'
        +filas.map(f=>'<tr>'+celdasDe(f).map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')
        +'</tbody></table></div>';
    }
    if(t==='alerta') return '<div class="row" style="background:var(--wash)">'
      +'<div class="txt" style="color:var(--deep)">'+esc(b.contenido||'')+'</div></div>';
    /* texto, y cualquier tipo que no conozcamos */
    const txt=b.contenido!=null?b.contenido:JSON.stringify(b,null,2);
    return '<div class="row"><div class="txt" style="white-space:pre-wrap'
      +(b.vacio?';color:var(--mid)':'')+'">'+esc(txt)+'</div></div>';
  })();
  return '<div class="panel" style="margin-bottom:18px">'
    +(titulo?'<h3>'+titulo+'</h3>':'')+cuerpo+'</div>';
}

/* Orden de urgencia: crítico primero, después atención, después en curso. */
function ringOrder(){
  const rank={crit:0,alert:1,ok:2};
